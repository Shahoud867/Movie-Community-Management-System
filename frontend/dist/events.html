<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find a Watch Party — Movie Community</title>
  <meta name="description" content="Discover and join upcoming watch parties." />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex flex-col">
  <a href="#main"
    class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-brand-600 text-white px-3 py-2 rounded">Skip
    to content</a>
  <div id="navbar-container"></div>

  <main id="main" class="flex-1">
    <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">
      <div class="flex items-center justify-between flex-wrap gap-4">
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Find a Watch Party</h1>
        <a href="./events-new.html"
          class="inline-flex items-center gap-2 rounded-md bg-brand-600 hover:bg-brand-700 transition-colors px-4 py-2.5 text-sm font-semibold">Host
          a New Event</a>
      </div>
      <section aria-labelledby="eventsHeading" class="space-y-4">
        <h2 id="eventsHeading" class="sr-only">Upcoming Events</h2>
        <div id="eventsList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite">
          <div class="h-32 rounded-lg bg-slate-800/70 border border-slate-700/60 animate-pulse"></div>
          <div class="h-32 rounded-lg bg-slate-800/70 border border-slate-700/60 animate-pulse"></div>
          <div class="h-32 rounded-lg bg-slate-800/70 border border-slate-700/60 animate-pulse"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="mt-auto border-t border-slate-800/60">
    <div class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-400 flex flex-wrap gap-4">
      <span>&copy; 2025 Movie Community</span>
      <span class="opacity-70">All rights reserved.</span>
      <span class="opacity-70">Events 1.0</span>
    </div>
  </footer>

  <script>
    async function apiFetch(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Request failed');
      return res.json();
    }
    function formatDateTime(dt) {
      try { return new Date(dt.replace(' ', 'T')).toLocaleString(); }
      catch { return dt; }
    }
    function createEventCard(evt) {
      const a = document.createElement('a');
      a.href = `./event.html?id=${evt.event_id}`;
      a.className = 'group block rounded-lg bg-slate-800/60 border border-slate-700/60 hover:border-brand-600/60 transition-colors p-4 space-y-2';
      const movieTitle = evt.movie_title || 'Unknown movie';
      const when = formatDateTime(evt.event_datetime || '');
      const cap = typeof evt.capacity === 'number' ? evt.capacity : '?';
      const cur = typeof evt.current_participants === 'number' ? evt.current_participants : 0;
      const host = evt.host_name || 'Unknown host';
      a.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <h3 class="text-base font-semibold group-hover:text-white">${evt.title || 'Watch Party'}</h3>
          <span class="text-[10px] px-2 py-0.5 rounded bg-brand-600/20 text-brand-300 border border-brand-600/30">${evt.status || 'Scheduled'}</span>
        </div>
        <p class="text-sm text-slate-300">Movie: <span class="font-medium">${movieTitle}</span></p>
        <p class="text-xs text-slate-400">Host: ${host}</p>
        <div class="flex items-center justify-between text-xs text-slate-400">
          <span>${when}</span>
          <span class="px-2 py-0.5 rounded bg-slate-700/60 text-slate-300 border border-slate-600/60">${cur} / ${cap}</span>
        </div>
      `;
      return a;
    }
    async function loadEvents() {
      const root = document.getElementById('eventsList');
      root.innerHTML = '<div class="col-span-full text-sm text-slate-400 animate-pulse">Loading events...</div>';
      try {
        const events = await apiFetch('/api/events?status=scheduled');
        root.innerHTML = '';
        if (!events.length) {
          root.innerHTML = '<p class="col-span-full text-sm text-slate-400">No upcoming watch parties. <a href="./events-new.html" class="text-brand-400 hover:text-brand-300">Host one!</a></p>';
          return;
        }
        events.forEach(evt => root.appendChild(createEventCard(evt)));
      } catch (e) {
        console.error('Failed to load events:', e);
        root.innerHTML = '<p class="col-span-full text-sm text-red-400">Failed to load events.</p>';
      }
    }
    
    document.addEventListener('DOMContentLoaded', async () => {
      // Load navbar component
      try {
        const response = await fetch('/components/navbar-enhanced.html');
        const html = await response.text();
        document.getElementById('navbar-container').innerHTML = html;
        
        // Execute the navbar script manually since innerHTML doesn't execute scripts
        const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/);
        if (scriptMatch) {
          const scriptContent = scriptMatch[1];
          const scriptEl = document.createElement('script');
          scriptEl.textContent = scriptContent;
          document.body.appendChild(scriptEl);
        }
      } catch (error) {
        console.error('Failed to load navbar:', error);
      }
      
      loadEvents();
    });
    
    (function () {
      let searchTimer = null;
      const searchInput = document.getElementById('globalSearch');
      const searchResults = document.getElementById('searchResults');
      const notifBtn = document.getElementById('notifBtn');
      const notifDropdown = document.getElementById('notifDropdown');
      const profileBtn = document.getElementById('profileBtn');
      const profileDropdown = document.getElementById('profileDropdown');
      if (searchInput) {
        searchInput.addEventListener('input', e => {
          const term = e.target.value.trim();
          if (searchTimer) clearTimeout(searchTimer);
          if (!term) { searchResults.classList.add('hidden'); return; }
          searchTimer = setTimeout(async () => {
            try {
              const res = await fetch('/api/movies/search?query=' + encodeURIComponent(term));
              const movies = await res.json();
              searchResults.innerHTML = '';
              if (!movies.length) {
                searchResults.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No movies found</div>';
                searchResults.classList.remove('hidden');
                return;
              }
              movies.forEach(m => {
                const a = document.createElement('a');
                a.href = `./movie.html?id=${m.id}`;
                a.className = 'block px-4 py-2 hover:bg-slate-800/60 text-sm';
                a.innerHTML = `<span class="font-medium">${m.title}</span> <span class="text-xs text-slate-400">(${m.release_year || ''})</span>`;
                searchResults.appendChild(a);
              });
              searchResults.classList.remove('hidden');
            } catch { }
          }, 300);
        });
      }
      if (notifBtn) {
        notifBtn.addEventListener('click', async () => {
          notifDropdown.classList.toggle('hidden');
          if (!notifDropdown.classList.contains('hidden')) { await loadNotifications(); }
        });
      }
      async function loadNotifications() {
        const list = document.getElementById('notifList');
        try {
          const res = await fetch('/api/notifications?unread=true');
          const notifs = await res.json();
          list.innerHTML = '';
          if (!notifs.length) {
            list.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No new notifications</div>';
            document.getElementById('notifBadge').classList.add('hidden');
            return;
          }
          const badge = document.getElementById('notifBadge');
          badge.textContent = Math.min(notifs.length, 9);
          badge.classList.remove('hidden');
          notifs.slice(0, 5).forEach(n => {
            const div = document.createElement('div');
            div.className = 'px-4 py-3 hover:bg-slate-700/40 cursor-pointer text-sm';
            div.innerHTML = `<p>${n.message}</p><p class="text-xs text-slate-400 mt-1">${new Date(n.created_date.replace(' ', 'T')).toLocaleString()}</p>`;
            div.addEventListener('click', async () => {
              await fetch(`/api/notifications/${n.id}/seen`, { method: 'POST' });
              await loadNotifications();
            });
            list.appendChild(div);
          });
        } catch { }
      }
      if (profileBtn) {
        profileBtn.addEventListener('click', () => profileDropdown.classList.toggle('hidden'));
      }
      (async () => {
        try {
          const res = await fetch('/api/auth/me');
          const user = await res.json();
          document.getElementById('profileName').textContent = user.name || 'User';
          document.getElementById('profileEmail').textContent = user.email || '';
          const avatar = document.getElementById('profileAvatar');
          const initials = (user.name || 'U').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
          avatar.textContent = initials;
          await loadNotifications();
        } catch { }
      })();
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); }
          catch (e) { console.error('Logout error', e); }
          window.location.href = '/login.html';
        });
      }
      document.addEventListener('click', e => {
        if (!notifBtn.contains(e.target) && !notifDropdown.contains(e.target)) notifDropdown.classList.add('hidden');
        if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) profileDropdown.classList.add('hidden');
        if (searchInput && !searchInput.contains(e.target) && !searchResults.contains(e.target)) searchResults.classList.add('hidden');
      });
    })();
  </script>
</body>

</html>
