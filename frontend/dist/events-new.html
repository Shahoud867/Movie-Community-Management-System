<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Host a New Watch Party — Movie Community</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="stylesheet" href="/css/styles.css" />
  
  <style>
    .suggestion-item { cursor: pointer; }
    .suggestion-item:hover { background-color: rgb(30 41 59 / 0.6); }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex flex-col">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-brand-600 text-white px-3 py-2 rounded">Skip to content</a>
  
  <!-- Enhanced Navbar Component -->
  <div id="navbar-container"></div>

  <main id="main" class="flex-1">
    <div class="max-w-2xl mx-auto px-4 py-8">
      <div class="mb-6 flex items-center justify-between">
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Host a New Watch Party</h1>
        <a href="./events.html" class="text-sm text-slate-300 hover:text-white">Back to Events</a>
      </div>

      <form id="eventForm" class="bg-slate-800/60 backdrop-blur rounded-xl border border-slate-700/60 shadow-lg p-6 space-y-5" novalidate>
        <div>
          <label class="block text-sm font-medium mb-1" for="title">Title</label>
          <input id="title" name="title" type="text" required class="w-full rounded-md bg-slate-900/60 border border-slate-700 px-3 py-2 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-600" placeholder="e.g. Inception Watch Party" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="description">Description</label>
          <textarea id="description" name="description" rows="4" class="w-full rounded-md bg-slate-900/60 border border-slate-700 px-3 py-2 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-600" placeholder="Tell people what to expect..."></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="movieSearch">Movie</label>
          <div class="relative">
            <input id="movieSearch" type="text" autocomplete="off" class="w-full rounded-md bg-slate-900/60 border border-slate-700 px-3 py-2 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-600" placeholder="Type to search movies..." />
            <input id="movieId" type="hidden" />
            <div id="suggestions" class="absolute z-10 mt-1 w-full bg-slate-900/95 border border-slate-700/80 rounded-md shadow-lg hidden max-h-64 overflow-y-auto"></div>
          </div>
          <p id="movieChosen" class="mt-2 text-xs text-slate-400 hidden">Selected: <span id="movieChosenTitle" class="font-medium"></span></p>
        </div>
        <div class="grid gap-4 grid-cols-1 sm:grid-cols-2">
          <div>
            <label class="block text-sm font-medium mb-1" for="eventDateTime">Date & Time</label>
            <input id="eventDateTime" type="datetime-local" required class="w-full rounded-md bg-slate-900/60 border border-slate-700 px-3 py-2 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-600" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1" for="capacity">Capacity</label>
            <input id="capacity" type="number" min="1" value="10" required class="w-full rounded-md bg-slate-900/60 border border-slate-700 px-3 py-2 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-600" />
          </div>
        </div>
        <button type="submit" class="w-full inline-flex items-center justify-center rounded-md bg-brand-600 hover:bg-brand-700 transition-colors px-4 py-2.5 text-sm font-semibold">Create Event</button>
        <p id="formMsg" class="text-xs text-slate-400"></p>
      </form>
    </div>
  </main>

  <footer class="mt-auto border-t border-slate-800/60">
    <div class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-400 flex flex-wrap gap-4">
      <span>&copy; 2025 Movie Community</span>
      <span class="opacity-70">All rights reserved.</span>
      <span class="opacity-70">Create Event 1.0</span>
    </div>
  </footer>

  <script>
    const qs = (s)=>document.querySelector(s);
    const suggestions = qs('#suggestions');
    let searchTimer = null;
    let pickedMovie = null;

    function setMessage(msg, isError=false){
      const el = qs('#formMsg');
      el.textContent = msg || '';
      el.className = 'text-xs ' + (isError ? 'text-red-400' : 'text-slate-400');
    }

    async function apiFetch(url, opts){
      const res = await fetch(url, opts);
      if(!res.ok){
        let err = 'Request failed';
        try { const j = await res.json(); err = j.error || err; } catch {}
        throw new Error(err);
      }
      return res.json();
    }

    function toSQLDateTime(local){
      // Convert 'YYYY-MM-DDTHH:mm' to 'YYYY-MM-DD HH:mm:ss'
      if(!local) return '';
      return local.replace('T',' ') + ':00';
    }

    function renderSuggestions(items){
      suggestions.innerHTML = '';
      if(!items.length){ suggestions.classList.add('hidden'); return; }
      items.forEach(m => {
        const div = document.createElement('div');
        div.className = 'suggestion-item px-3 py-2 text-sm border-b border-slate-800/60 last:border-0';
        div.innerHTML = `<span class="font-medium">${m.title}</span> <span class="text-xs text-slate-400">(${m.release_year||'—'})</span>`;
        div.addEventListener('click', () => {
          pickedMovie = m;
          qs('#movieId').value = m.movie_id;
          qs('#movieSearch').value = m.title;
          qs('#movieChosenTitle').textContent = m.title;
          qs('#movieChosen').classList.remove('hidden');
          suggestions.classList.add('hidden');
        });
        suggestions.appendChild(div);
      });
      suggestions.classList.remove('hidden');
    }

    async function onSearchInput(e){
      const term = e.target.value.trim();
      qs('#movieId').value = '';
      pickedMovie = null;
      if(searchTimer) clearTimeout(searchTimer);
      if(!term){ suggestions.classList.add('hidden'); return; }
      searchTimer = setTimeout(async () => {
        try {
          const results = await apiFetch('/api/movies/search?query=' + encodeURIComponent(term));
          renderSuggestions(results);
        } catch(err){ setMessage(err.message, true); }
      }, 250);
    }

    async function onSubmit(e){
      e.preventDefault();
      setMessage('');
      const title = qs('#title').value.trim();
      const description = qs('#description').value.trim();
      const movie_id = parseInt(qs('#movieId').value);
      const dtLocal = qs('#eventDateTime').value;
      const capacity = parseInt(qs('#capacity').value || '1', 10);

      if(!title || !movie_id || !dtLocal){
        setMessage('Please provide a title, pick a movie, and choose date/time.', true);
        return;
      }

      const payload = {
        title,
        description,
        movie_id,
        event_datetime: toSQLDateTime(dtLocal),
        capacity: Math.max(1, capacity)
      };

      try {
        const res = await apiFetch('/api/events', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        if(res?.event_id){
          location.href = `./event.html?id=${res.event_id}`;
        } else {
          setMessage('Event created, but missing ID.');
        }
      } catch(err){ setMessage(err.message, true); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      qs('#movieSearch').addEventListener('input', onSearchInput);
      document.addEventListener('click', (evt) => {
        if(!suggestions.contains(evt.target) && evt.target !== qs('#movieSearch')){
          suggestions.classList.add('hidden');
        }
      });
      qs('#eventForm').addEventListener('submit', onSubmit);
    });
  </script>
  
  <!-- Load Navbar Component -->
  <script>
    (async function loadNavbar() {
      try {
        const response = await fetch('/components/navbar-enhanced.html');
        const html = await response.text();
        document.getElementById('navbar-container').innerHTML = html;
        
        // Execute any scripts in the loaded HTML
        const navbarContainer = document.getElementById('navbar-container');
        const scripts = navbarContainer.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      } catch (error) {
        console.error('Failed to load navbar:', error);
      }
    })();
  </script>
</body>
</html>
