<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • Movie Management</title>
  <link rel="stylesheet" href="/css/styles.css" />
  
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex">
  <div id="sidebar"></div>
  <main class="flex-1 min-w-0">
    <header class="border-b border-slate-800/60 px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-semibold">Movie Management</h1>
      <a class="text-sm text-brand-400 hover:text-brand-300" href="../dashboard.html">← Back to App</a>
    </header>
    <section class="p-4">
      <div class="mb-3 flex gap-2 flex-wrap items-center">
        <input id="search"
          class="bg-slate-800/60 border border-slate-700 rounded px-3 py-2 text-sm flex-1 min-w-[200px]"
          placeholder="Search movies" />
        <a href="movies/new.html" class="bg-green-600 hover:bg-green-500 rounded px-4 py-2 text-sm font-medium">+ Add
          New Movie</a>
        <button id="refreshBtn" class="bg-brand-600 hover:bg-brand-500 rounded px-3 py-2 text-sm">Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-slate-400 border-b border-slate-800">
            <tr>
              <th class="text-left py-2 px-2">Movie ID</th>
              <th class="text-left py-2 px-2">Title</th>
              <th class="text-left py-2 px-2">Release Year</th>
              <th class="text-left py-2 px-2">Director</th>
              <th class="text-left py-2 px-2">Added By Admin</th>
              <th class="text-left py-2 px-2">Actions</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    (async function () {
      document.getElementById('sidebar').innerHTML = await fetch('../components/admin-sidebar.html').then(r => r.text());

      const rows = document.getElementById('rows');
      const searchInput = document.getElementById('search');
      let debounceTimer;

      async function load(query = '') {
        try {
          const url = query ? `/api/movies?search=${encodeURIComponent(query)}` : '/api/movies';
          const response = await fetch(url);

          if (!response.ok) throw new Error('Failed to fetch movies');

          const data = await response.json();
          const movies = Array.isArray(data) ? data : (data.movies || []);

          if (movies.length === 0) {
            rows.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-500">No movies found</td></tr>`;
            return;
          }

          rows.innerHTML = movies.map(movie => `
            <tr class="hover:bg-slate-800/50 transition-colors">
              <td class="py-2 px-2 text-slate-500 font-mono text-xs">#${movie.movie_id}</td>
              <td class="py-2 px-2">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-12 bg-slate-800 rounded overflow-hidden flex-shrink-0">
                    ${movie.poster ? `<img src="/${movie.poster}" onerror="this.onerror=null;this.src='/images/posters/placeholder.jpg';" class="w-full h-full object-cover" alt="">` : '<div class="w-full h-full flex items-center justify-center text-xs text-slate-600">No Img</div>'}
                  </div>
                  <span class="font-medium text-slate-200">${movie.title}</span>
                </div>
              </td>
              <td class="py-2 px-2 text-slate-400">${movie.release_year || '-'}</td>
              <td class="py-2 px-2 text-slate-400">${movie.director || '-'}</td>
              <td class="py-2 px-2 text-slate-500 text-xs">${movie.added_by_admin ? 'Admin #' + movie.added_by_admin : 'System'}</td>
              <td class="py-2 px-2">
                <div class="flex items-center gap-2">
                  <a href="movies/edit.html?id=${movie.movie_id}" class="text-brand-400 hover:text-brand-300">Edit</a>
                  <button data-action="delete" data-id="${movie.movie_id}" class="text-red-400 hover:text-red-300">Delete</button>
                </div>
              </td>
            </tr>
          `).join('');

        } catch (error) {
          console.error('Load movies error:', error);
          rows.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-400">Error loading movies</td></tr>`;
        }
      }

      // Event delegation for delete button
      rows.addEventListener('click', async (e) => {
        const button = e.target.closest('button[data-action="delete"]');
        if (!button) return;

        const id = button.dataset.id;
        if (!confirm('Are you sure you want to delete this movie? This action cannot be undone.')) return;

        try {
          const response = await fetch(`/api/admin/movies/${id}`, { method: 'DELETE' });
          if (response.ok) {
            load(searchInput.value);
          } else {
            const data = await response.json();
            alert(data.error || 'Failed to delete movie');
          }
        } catch (error) {
          console.error('Delete movie error:', error);
          alert('Error deleting movie');
        }
      });

      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => load(e.target.value), 300);
      });

      document.getElementById('refreshBtn').addEventListener('click', () => {
        searchInput.value = '';
        load();
      });

      load();
    })();
  </script>
</body>

</html>
