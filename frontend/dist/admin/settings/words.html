<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Words - Admin Panel</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gray-100">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 p-8">
            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Restricted Words</h1>
                <p class="text-gray-600 mt-2">Manage words that are flagged or blocked in user content</p>
            </div>

            <!-- Add Word Form -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Add Restricted Word</h2>
                <form id="addWordForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="word" class="block text-sm font-medium text-gray-700 mb-2">Word *</label>
                            <input 
                                type="text" 
                                id="word" 
                                name="word" 
                                required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="Enter restricted word"
                            >
                        </div>
                        <div>
                            <label for="severity" class="block text-sm font-medium text-gray-700 mb-2">Severity *</label>
                            <select 
                                id="severity" 
                                name="severity" 
                                required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            >
                                <option value="">Select severity</option>
                                <option value="low">Low - Warning only</option>
                                <option value="medium">Medium - Requires moderation</option>
                                <option value="high">High - Auto-block</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button 
                            type="submit"
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-200"
                        >
                            Add Word
                        </button>
                    </div>
                </form>
            </div>

            <!-- Restricted Words Table -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-semibold text-gray-800">Restricted Words List</h2>
                        <button 
                            onclick="loadWords()"
                            class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition duration-200"
                        >
                            <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            Refresh
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Word ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Word</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Severity</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Added By</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Added Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="wordsTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Words will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- API Integration: Connect backend to manage restricted words -->
    <script>
        // Load sidebar
        fetch('../../components/admin-sidebar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('sidebar-container').innerHTML = html;
            });

        // Load restricted words
        async function loadWords() {
            const tbody = document.getElementById('wordsTableBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                        Connect backend to load restricted words
                    </td>
                </tr>
            `;
            // TODO: Replace with actual backend API call
            // const response = await fetch('/api/admin/restricted-words');
        }

        // Get severity badge HTML
        function getSeverityBadge(severity) {
            const badges = {
                low: '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">Low</span>',
                medium: '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-orange-100 text-orange-800">Medium</span>',
                high: '<span class="px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">High</span>'
            };
            return badges[severity] || severity;
        }

        // Add new word
        document.getElementById('addWordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            alert('Connect backend to enable add word functionality');
        });

        // Enable edit mode
        function enableEdit(wordId) {
            const row = document.getElementById(`row-${wordId}`);
            row.querySelectorAll('.edit-mode-hide').forEach(el => el.classList.add('hidden'));
            row.querySelectorAll('.edit-mode-show').forEach(el => el.classList.remove('hidden'));
        }

        // Cancel edit mode
        function cancelEdit(wordId) {
            loadWords(); // Reload to reset values
        }

        // Save edit
        async function saveEdit(wordId) {
            const row = document.getElementById(`row-${wordId}`);
            const word = row.querySelector('[data-field="word"]').value.trim().toLowerCase();
            const severity = row.querySelector('[data-field="severity"]').value;

            if (!word) {
                alert('Word cannot be empty');
                return;
            }

            try {
                const response = await fetch(`/api/admin/restricted-words/${wordId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word, severity })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Word updated successfully!');
                    loadWords();
                } else {
                    alert(result.error || 'Failed to update word');
                }
            } catch (error) {
                console.error('Error updating word:', error);
                alert('Failed to update word');
            }
        }

        // Delete word
        async function deleteWord(wordId) {
            if (!confirm('Are you sure you want to delete this restricted word?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/restricted-words/${wordId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Word deleted successfully!');
                    loadWords();
                } else {
                    alert(result.error || 'Failed to delete word');
                }
            } catch (error) {
                console.error('Error deleting word:', error);
                alert('Failed to delete word');
            }
        }

        // Initial load
        loadWords();
    </script>
</body>
</html>
