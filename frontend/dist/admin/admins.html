<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • Admin Management</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex">
  <div id="sidebar"></div>
  <main class="flex-1 min-w-0">
    <header class="border-b border-slate-800/60 px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-semibold">Admin Management</h1>
      <a class="text-sm text-brand-400 hover:text-brand-300" href="../dashboard.html">← Back to App</a>
    </header>
    <section class="p-4">
      <div class="mb-4 flex gap-2 items-center justify-between">
        <p class="text-sm text-slate-400">Super admin access required. Manage administrator accounts.</p>
        <button id="addBtn" class="bg-green-600 hover:bg-green-500 rounded px-4 py-2 text-sm font-medium">+ Add New
          Admin</button>
      </div>
      <div id="addForm" class="hidden bg-slate-800/60 border border-slate-700 rounded p-4 mb-4">
        <h2 class="text-sm font-semibold mb-3">Add New Admin</h2>
        <form id="adminForm" class="grid grid-cols-1 md:grid-cols-[2fr_2fr_1.5fr_1fr_auto] gap-3">
          <input id="new-name" required class="bg-slate-900/60 border border-slate-700 rounded px-3 py-2 text-sm"
            placeholder="Name*" />
          <input id="new-email" type="email" required
            class="bg-slate-900/60 border border-slate-700 rounded px-3 py-2 text-sm" placeholder="Email*" />
          <select id="new-role" required class="bg-slate-900/60 border border-slate-700 rounded px-3 py-2 text-sm capitalize">
            <option value="">Select Role*</option>
            <option value="admin">Admin</option>
            <option value="moderator">Moderator</option>
            <option value="content_manager">Content Manager</option>
            <option value="support">Support</option>
          </select>
          <label
            class="flex items-center gap-2 text-sm bg-slate-900/60 border border-slate-700 rounded px-3 py-2 cursor-pointer">
            <input id="new-super" type="checkbox" class="rounded bg-slate-700 border-slate-600" />
            <span>Super Admin</span>
          </label>
          <div class="flex gap-2">
            <button type="submit"
              class="bg-green-600 hover:bg-green-500 rounded px-4 py-2 text-sm font-medium">Add</button>
            <button type="button" id="cancelAdd"
              class="bg-slate-700 hover:bg-slate-600 rounded px-4 py-2 text-sm">Cancel</button>
          </div>
        </form>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-slate-400 border-b border-slate-800">
            <tr>
              <th class="text-left py-2 px-2">Admin ID</th>
              <th class="text-left py-2 px-2">Name</th>
              <th class="text-left py-2 px-2">Email</th>
              <th class="text-left py-2 px-2">Role</th>
              <th class="text-left py-2 px-2">Super Admin</th>
              <th class="text-left py-2 px-2">Actions</th>
            </tr>
          </thead>
          <tbody id="list" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </main>
  <!-- API Integration: Connect backend to manage admins -->
  <script>
    (async function () {
      document.getElementById('sidebar').innerHTML = await fetch('../components/admin-sidebar.html').then(r => r.text());

      let editingId = null;

      async function load() {
        const tbody = document.getElementById('list');

        try {
          const response = await fetch('/api/admin/admins');

          if (!response.ok) {
            if (response.status === 403) {
              tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-red-400">Access Denied: Super Admin privileges required</td></tr>';
              document.getElementById('addBtn').classList.add('hidden');
              return;
            }
            throw new Error('Failed to load admins');
          }

          const admins = await response.json();

          if (admins.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-slate-400">No admins found</td></tr>';
            return;
          }

          tbody.innerHTML = admins.map(admin => `
            <tr class="hover:bg-slate-800/20" id="row-${admin.admin_id}">
              <td class="py-2 px-2 text-slate-400">#${admin.admin_id}</td>
              <td class="py-2 px-2 font-medium text-white">
                <span class="view-mode">${admin.name}</span>
                <input class="edit-mode hidden bg-slate-900/60 border border-slate-700 rounded px-2 py-1 text-xs w-full" value="${admin.name}" data-field="name">
              </td>
              <td class="py-2 px-2 text-slate-300">
                <span class="view-mode">${admin.email}</span>
                <input class="edit-mode hidden bg-slate-900/60 border border-slate-700 rounded px-2 py-1 text-xs w-full" value="${admin.email}" data-field="email">
              </td>
              <td class="py-2 px-2 text-slate-400">
                <span class="view-mode capitalize">${admin.role.replace('_', ' ')}</span>
                 <select class="edit-mode hidden bg-slate-900/60 border border-slate-700 rounded px-2 py-1 text-xs w-full capitalize" data-field="role">
                  <option value="admin" ${admin.role === 'admin' ? 'selected' : ''}>Admin</option>
                  <option value="moderator" ${admin.role === 'moderator' ? 'selected' : ''}>Moderator</option>
                  <option value="content_manager" ${admin.role === 'content_manager' ? 'selected' : ''}>Content Manager</option>
                  <option value="support" ${admin.role === 'support' ? 'selected' : ''}>Support</option>
                </select>
              </td>
              <td class="py-2 px-2">
                <span class="view-mode ${admin.is_super_admin ? 'text-green-400' : 'text-slate-500'}">${admin.is_super_admin ? 'Yes' : 'No'}</span>
                <input type="checkbox" class="edit-mode hidden rounded bg-slate-700 border-slate-600" ${admin.is_super_admin ? 'checked' : ''} data-field="is_super_admin">
              </td>
              <td class="py-2 px-2">
                <div class="view-mode flex items-center gap-2">
                  <button data-action="edit" data-id="${admin.admin_id}" class="text-brand-400 hover:text-brand-300 text-xs font-medium px-2 py-1 rounded hover:bg-brand-400/10 transition-colors">Edit</button>
                  <button data-action="delete" data-id="${admin.admin_id}" class="text-red-400 hover:text-red-300 text-xs font-medium px-2 py-1 rounded hover:bg-red-400/10 transition-colors">Delete</button>
                </div>
                <div class="edit-mode hidden flex items-center gap-2">
                  <button data-action="save" data-id="${admin.admin_id}" class="text-green-400 hover:text-green-300 text-xs font-medium px-2 py-1 rounded hover:bg-green-400/10 transition-colors">Save</button>
                  <button data-action="cancel" class="text-slate-400 hover:text-slate-300 text-xs font-medium px-2 py-1 rounded hover:bg-slate-400/10 transition-colors">Cancel</button>
                </div>
              </td>
            </tr>
          `).join('');

        } catch (error) {
          console.error('Load admins error:', error);
          tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-red-400">Error loading admins</td></tr>';
        }
      }

      document.getElementById('addBtn').addEventListener('click', () => {
        document.getElementById('addForm').classList.remove('hidden');
      });
      document.getElementById('cancelAdd').addEventListener('click', () => {
        document.getElementById('addForm').classList.add('hidden');
        document.getElementById('adminForm').reset();
      });

      document.getElementById('adminForm').addEventListener('submit', async e => {
        e.preventDefault();

        const name = document.getElementById('new-name').value;
        const email = document.getElementById('new-email').value;
        const role = document.getElementById('new-role').value;
        const is_super_admin = document.getElementById('new-super').checked;
        const password = 'password123'; // Default password, should be changed by user later or input field added

        try {
          const response = await fetch('/api/admin/admins', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, role, is_super_admin })
          });

          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.error || 'Failed to add admin');
          }

          document.getElementById('addForm').classList.add('hidden');
          document.getElementById('adminForm').reset();
          load();
          alert('Admin added successfully with default password "password123"');

        } catch (error) {
          console.error('Add admin error:', error);
          alert(error.message);
        }
      });

      // Event delegation for all button clicks
      document.getElementById('list').addEventListener('click', async (e) => {
        const button = e.target.closest('button[data-action]');
        if (!button) return;

        const action = button.dataset.action;
        const id = button.dataset.id;

        if (action === 'edit') {
          if (editingId) {
            const prevRow = document.getElementById(`row-${editingId}`);
            if (prevRow) {
              prevRow.querySelectorAll('.view-mode').forEach(el => el.classList.remove('hidden'));
              prevRow.querySelectorAll('.edit-mode').forEach(el => el.classList.add('hidden'));
            }
          }
          editingId = parseInt(id);
          const row = document.getElementById(`row-${id}`);
          row.querySelectorAll('.view-mode').forEach(el => el.classList.add('hidden'));
          row.querySelectorAll('.edit-mode').forEach(el => el.classList.remove('hidden'));
        } else if (action === 'cancel') {
          if (!editingId) return;
          const row = document.getElementById(`row-${editingId}`);
          if (row) {
            row.querySelectorAll('.view-mode').forEach(el => el.classList.remove('hidden'));
            row.querySelectorAll('.edit-mode').forEach(el => el.classList.add('hidden'));
          }
          editingId = null;
          load();
        } else if (action === 'save') {
          const row = document.getElementById(`row-${id}`);
          const name = row.querySelector('[data-field="name"]').value;
          const email = row.querySelector('[data-field="email"]').value;
          const role = row.querySelector('[data-field="role"]').value;
          const is_super_admin = row.querySelector('[data-field="is_super_admin"]').checked;

          try {
            const response = await fetch(`/api/admin/admins/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, role, is_super_admin })
            });

            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.error || 'Failed to update admin');
            }

            editingId = null;
            load();
          } catch (error) {
            console.error('Update admin error:', error);
            alert(error.message);
          }
        } else if (action === 'delete') {
          if (!confirm('Are you sure you want to delete this admin?')) return;

          try {
            const response = await fetch(`/api/admin/admins/${id}`, {
              method: 'DELETE'
            });

            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.error || 'Failed to delete admin');
            }

            load();
          } catch (error) {
            console.error('Delete admin error:', error);
            alert(error.message);
          }
        }
      });

      load();
    })();
  </script>
</body>

</html>
