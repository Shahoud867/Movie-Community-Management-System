<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • Genre Management</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex">
  <div id="sidebar"></div>
  <main class="flex-1 min-w-0">
    <header class="border-b border-slate-800/60 px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-semibold">Genre Management</h1>
      <a class="text-sm text-brand-400 hover:text-brand-300" href="../dashboard.html">← Back to App</a>
    </header>
    <section class="p-4 max-w-4xl">
      <div class="bg-slate-800/60 border border-slate-700 rounded p-4 mb-4">
        <h2 class="text-sm font-semibold mb-3">Add New Genre</h2>
        <form id="addForm" class="grid grid-cols-1 md:grid-cols-[2fr_3fr_auto] gap-3">
          <input id="name" required class="bg-slate-900/60 border border-slate-700 rounded px-3 py-2 text-sm"
            placeholder="Genre name*" />
          <input id="description" class="bg-slate-900/60 border border-slate-700 rounded px-3 py-2 text-sm"
            placeholder="Description (optional)" />
          <button class="bg-green-600 hover:bg-green-500 rounded px-4 py-2 text-sm font-medium">Add</button>
        </form>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-slate-400 border-b border-slate-800">
            <tr>
              <th class="text-left py-2 px-2">Genre ID</th>
              <th class="text-left py-2 px-2">Genre Name</th>
              <th class="text-left py-2 px-2">Description</th>
              <th class="text-left py-2 px-2">Actions</th>
            </tr>
          </thead>
          <tbody id="list" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    (async function () {
      const sidebar = await fetch('../components/admin-sidebar.html').then(r => r.text());
      document.getElementById('sidebar').innerHTML = sidebar;

      let editingId = null;

      async function load() {
        const tbody = document.getElementById('list');

        try {
          tbody.innerHTML = '<tr><td colspan="4" class="py-12 text-center text-slate-400">Loading genres...</td></tr>';

          const response = await fetch('/api/admin/genres', { credentials: 'include' });

          if (!response.ok) {
            throw new Error('Failed to load genres');
          }

          const genres = await response.json();

          if (genres.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="py-12 text-center text-slate-400">No genres found. Add one above!</td></tr>';
            return;
          }

          tbody.innerHTML = genres.map(genre => {
            if (editingId === genre.genre_id) {
              return `<tr class="bg-slate-800/40">
                <td class="py-2 px-2">${genre.genre_id}</td>
                <td class="py-2 px-2"><input id="editName" value="${genre.genre_name}" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm w-full"/></td>
                <td class="py-2 px-2"><input id="editDesc" value="${genre.description || ''}" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm w-full"/></td>
                <td class="py-2 px-2">
                  <button data-action="save" data-id="${genre.genre_id}" class="text-green-400 hover:text-green-300 text-xs mr-2">Save</button>
                  <button data-action="cancel" class="text-slate-400 hover:text-slate-300 text-xs">Cancel</button>
                </td>
              </tr>`;
            }

            return `<tr class="hover:bg-slate-800/20">
              <td class="py-2 px-2">${genre.genre_id}</td>
              <td class="py-2 px-2 font-medium">${genre.genre_name}</td>
              <td class="py-2 px-2 text-slate-400">${genre.description || '-'}</td>
              <td class="py-2 px-2">
                <button data-action="edit" data-id="${genre.genre_id}" class="text-brand-400 hover:text-brand-300 text-xs mr-2">Edit</button>
                <button data-action="delete" data-id="${genre.genre_id}" class="text-red-400 hover:text-red-300 text-xs">Delete</button>
              </td>
            </tr>`;
          }).join('');

        } catch (error) {
          console.error('Load genres error:', error);
          tbody.innerHTML = '<tr><td colspan="4" class="py-12 text-center text-red-400">Failed to load genres. Please ensure you are logged in as admin.</td></tr>';
        }
      }

      // Event delegation for all button clicks
      document.getElementById('list').addEventListener('click', async (e) => {
        const button = e.target.closest('button[data-action]');
        if (!button) return;

        const action = button.dataset.action;
        const id = button.dataset.id;

        if (action === 'edit') {
          editingId = parseInt(id);
          load();
        } else if (action === 'cancel') {
          editingId = null;
          load();
        } else if (action === 'save') {
          const genre_name = document.getElementById('editName').value;
          const description = document.getElementById('editDesc').value;

          if (!genre_name) {
            alert('Genre name is required');
            return;
          }

          try {
            const response = await fetch(`/api/admin/genres/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ genre_name, description })
            });

            if (!response.ok) {
              throw new Error('Failed to update genre');
            }

            editingId = null;
            load();
          } catch (error) {
            console.error('Save error:', error);
            alert('Failed to update genre');
          }
        } else if (action === 'delete') {
          if (!confirm('Are you sure you want to delete this genre?')) {
            return;
          }

          try {
            const response = await fetch(`/api/admin/genres/${id}`, {
              method: 'DELETE',
              credentials: 'include'
            });

            if (!response.ok) {
              throw new Error('Failed to delete genre');
            }

            load();
          } catch (error) {
            console.error('Delete error:', error);
            alert('Failed to delete genre');
          }
        }
      });

      document.getElementById('addForm').addEventListener('submit', async e => {
        e.preventDefault();

        const genre_name = document.getElementById('name').value;
        const description = document.getElementById('description').value;

        try {
          const response = await fetch('/api/admin/genres', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ genre_name, description })
          });

          if (!response.ok) {
            throw new Error('Failed to create genre');
          }

          document.getElementById('name').value = '';
          document.getElementById('description').value = '';
          load();
        } catch (error) {
          console.error('Add genre error:', error);
          alert('Failed to create genre');
        }
      });

      load();
    })();
  </script>
</body>

</html>
