<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages — Movie Community</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .avatar { background: #334155; }
    .bubble { max-width: 80%; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex flex-col">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-brand-600 text-white px-3 py-2 rounded">Skip to content</a>
  <div id="navbar-container"></div>

  <main id="main" class="flex-1">
    <div class="max-w-7xl mx-auto px-4 py-8 grid gap-6 lg:grid-cols-[360px_1fr]">
      <!-- Left: Conversation list -->
      <aside class="bg-slate-800/60 border border-slate-700/60 rounded-xl overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-700/60 flex items-center justify-between">
          <h2 class="text-sm font-semibold">Conversations</h2>
          <a href="./friends.html" class="text-xs text-brand-400 hover:text-brand-300">Find friends</a>
        </div>
        <div id="convList" class="max-h-[70vh] overflow-y-auto">
          <div class="px-4 py-3 text-sm text-slate-400">Loading...</div>
        </div>
      </aside>

      <!-- Right: Chat window -->
      <section class="bg-slate-800/60 border border-slate-700/60 rounded-xl flex flex-col min-h-[60vh]">
        <div id="chatHeader" class="px-4 py-3 border-b border-slate-700/60 flex items-center gap-3">
          <div id="chatAvatar" class="h-8 w-8 rounded-full avatar flex items-center justify-center text-xs font-semibold">U</div>
          <div class="flex-1">
            <h3 id="chatName" class="text-sm font-semibold">Select a conversation</h3>
            <p id="chatSub" class="text-xs text-slate-400">—</p>
          </div>
        </div>
        <div id="chatScroll" class="flex-1 p-4 space-y-3 overflow-y-auto">
          <p class="text-sm text-slate-400">Pick someone from the left to start chatting.</p>
        </div>
        <form id="chatForm" class="p-3 border-t border-slate-700/60 flex items-end gap-2">
          <textarea id="chatInput" rows="1" placeholder="Type a message..." class="flex-1 resize-none rounded-md bg-slate-900/60 border border-slate-700 px-3 py-2 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-600" disabled></textarea>
          <button id="sendBtn" class="shrink-0 inline-flex items-center justify-center rounded-md bg-brand-600 hover:bg-brand-700 transition-colors px-4 py-2 text-sm font-semibold disabled:opacity-50 disabled:cursor-not-allowed" disabled>Send</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="mt-auto border-t border-slate-800/60">
    <div class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-400 flex flex-wrap gap-4">
      <span>&copy; 2025 Movie Community</span>
      <span class="opacity-70">All rights reserved.</span>
      <span class="opacity-70">Messages 1.0</span>
    </div>
  </footer>

  <script>
    const qs = (s)=>document.querySelector(s);
    const qsp = new URLSearchParams(location.search);
    const ACTIVE_ID = parseInt(qsp.get('user_id')) || null;

    async function apiFetch(url, opts = {}){
      const token = localStorage.getItem('userToken');
      const headers = {
        ...(opts.headers || {}),
        'Authorization': token ? `Bearer ${token}` : ''
      };
      const res = await fetch(url, { ...opts, headers, credentials: 'include' });
      if(!res.ok){
        let err = 'Request failed';
        try { const j = await res.json(); err = j.error || err; } catch{}
        throw new Error(err);
      }
      return res.json();
    }
    function initials(name){ if(!name) return 'U'; const p=name.trim().split(/\s+/); return (p[0][0]||'U') + (p[1]?.[0]||''); }

    let currentUser = null;
    let activeUser = null; // other user for active chat

    function renderConvItem(conv){
      const wrapper = document.createElement('a');
      wrapper.className = 'flex items-center gap-3 px-4 py-3 border-b border-slate-700/60 hover:bg-slate-900/40 cursor-pointer';
      // API returns user_id and name directly on conv, not nested
      const userId = conv.user_id;
      const userName = conv.name || 'User';
      if(!userId) return document.createElement('div');
      wrapper.href = `./messages.html?user_id=${userId}`;
      const av = document.createElement('div');
      av.className = 'h-9 w-9 rounded-full avatar flex items-center justify-center text-sm font-semibold';
      av.textContent = initials(userName);
      const box = document.createElement('div');
      box.className = 'min-w-0 flex-1';
      const name = document.createElement('p');
      name.className = 'text-sm font-medium';
      name.textContent = userName;
      const last = document.createElement('p');
      last.className = 'text-xs text-slate-400 truncate max-w-[220px]';
      last.textContent = conv.last_message || '';
      box.appendChild(name); box.appendChild(last);
      wrapper.appendChild(av); wrapper.appendChild(box);
      // Show unread badge
      if(conv.unread_count > 0){
        const badge = document.createElement('span');
        badge.className = 'ml-auto bg-brand-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center';
        badge.textContent = conv.unread_count;
        wrapper.appendChild(badge);
      }
      if(ACTIVE_ID === userId){ wrapper.classList.add('bg-slate-900/50'); }
      return wrapper;
    }

    async function loadConversations(){
      const root = qs('#convList');
      root.innerHTML = '';
      try {
        const list = await apiFetch('/api/messages/conversations');
        if(!list.length){ root.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No conversations yet.</div>'; return; }
        list.forEach(c => root.appendChild(renderConvItem(c)));
      } catch(e){ root.innerHTML = `<div class='px-4 py-3 text-sm text-red-400'>${e.message}</div>`; }
    }

    function renderMessageBubble(msg){
      const mine = msg.sender_id === currentUser?.user_id;
      const row = document.createElement('div');
      row.className = 'flex flex-col gap-1 ' + (mine ? 'items-end' : 'items-start');
      
      // Sender name for received messages
      if (!mine && activeUser) {
        const senderName = document.createElement('div');
        senderName.className = 'text-xs text-slate-400 px-1';
        senderName.textContent = activeUser.name || 'User';
        row.appendChild(senderName);
      }
      
      const b = document.createElement('div');
      b.className = 'bubble px-3 py-2 rounded-lg text-sm ' + (mine ? 'bg-brand-600 text-white' : 'bg-slate-700/70');
      b.textContent = msg.content;
      row.appendChild(b);
      
      // Timestamp and read status
      const meta = document.createElement('div');
      meta.className = 'flex items-center gap-2 px-1 text-xs text-slate-400';
      
      // Format timestamp
      const time = new Date(msg.sent_date).toLocaleTimeString('en-US', { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      const timeSpan = document.createElement('span');
      timeSpan.textContent = time;
      meta.appendChild(timeSpan);
      
      // Read status for sent messages (mine)
      if (mine) {
        const statusIcon = document.createElement('span');
        statusIcon.className = 'flex items-center';
        if (msg.read_status) {
          // Double checkmark for read
          statusIcon.innerHTML = '✓✓';
          statusIcon.className += ' text-blue-400';
          statusIcon.title = `Read ${msg.read_date ? new Date(msg.read_date).toLocaleString() : ''}`;
        } else {
          // Single checkmark for sent but not read
          statusIcon.innerHTML = '✓';
          statusIcon.className += ' text-slate-400';
          statusIcon.title = 'Sent';
        }
        meta.appendChild(statusIcon);
      }
      
      row.appendChild(meta);
      return row;
    }

    async function loadChat(otherId){
      const scroll = qs('#chatScroll');
      scroll.innerHTML = '';
      if(!otherId){
        scroll.innerHTML = '<p class="text-sm text-slate-400">Pick someone from the left to start chatting.</p>';
        qs('#chatInput').disabled = true;
        qs('#sendBtn').disabled = true;
        qs('#chatName').textContent = 'Select a conversation';
        qs('#chatSub').textContent = '—';
        return;
      }
      try {
        const response = await apiFetch(`/api/users/${otherId}`);
        // API returns { user: {...} }, so extract the user object
        const user = response.user || response;
        activeUser = user;
        qs('#chatAvatar').textContent = initials(user.name);
        qs('#chatName').textContent = user.name || 'User';
        qs('#chatSub').textContent = 'Private messages';
        qs('#chatInput').disabled = false;
        qs('#sendBtn').disabled = false;

        const msgs = await apiFetch(`/api/messages?user_id=${otherId}`);
        msgs.forEach(m => scroll.appendChild(renderMessageBubble(m)));
        setTimeout(() => { scroll.scrollTop = scroll.scrollHeight; }, 0);
        
        // Mark conversation as read
        await apiFetch('/api/messages/mark-read', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ user_id: otherId })
        }).catch(() => {}); // Silently fail if error
        
        // Refresh conversation list to update unread counts
        await loadConversations();
      } catch(e){
        scroll.innerHTML = `<p class='text-sm text-red-400'>${e.message}</p>`;
      }
    }

    async function sendMessage(e){
      e.preventDefault();
      if(!activeUser || !activeUser.user_id) {
        alert('Please select a conversation first');
        return;
      }
      const input = qs('#chatInput');
      const content = input.value.trim();
      if(!content) return;
      try {
        await apiFetch('/api/messages', { 
          method: 'POST', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify({ receiver_id: activeUser.user_id, content }) 
        });
        input.value = '';
        await loadChat(activeUser.user_id);
        await loadConversations();
      } catch(e){ 
        alert(e.message || 'Failed to send message'); 
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Load navbar component
      try {
        const response = await fetch('/components/navbar-enhanced.html');
        const html = await response.text();
        document.getElementById('navbar-container').innerHTML = html;
        
        // Execute the navbar script manually since innerHTML doesn't execute scripts
        const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/);
        if (scriptMatch) {
          const scriptContent = scriptMatch[1];
          const scriptEl = document.createElement('script');
          scriptEl.textContent = scriptContent;
          document.body.appendChild(scriptEl);
        }
      } catch (error) {
        console.error('Failed to load navbar:', error);
      }

      try { 
        const response = await apiFetch('/api/auth/me');
        currentUser = response.user || response;
      } catch {}
      await loadConversations();
      await loadChat(ACTIVE_ID);
      qs('#chatForm').addEventListener('submit', sendMessage);
      // Enter to send, Shift+Enter for newline
      const input = qs('#chatInput');
      input.addEventListener('keydown', (ev) => {
        if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); qs('#sendBtn').click(); }
      });
    });
  </script>
  <script>
  (function() {
    let searchTimer = null;
    const searchInput = document.getElementById('globalSearch');
    const searchResults = document.getElementById('searchResults');
    const notifBtn = document.getElementById('notifBtn');
    const notifDropdown = document.getElementById('notifDropdown');
    const profileBtn = document.getElementById('profileBtn');
    const profileDropdown = document.getElementById('profileDropdown');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const term = e.target.value.trim();
        if (searchTimer) clearTimeout(searchTimer);
        if (!term) { searchResults.classList.add('hidden'); return; }
        searchTimer = setTimeout(async () => {
          try {
            const res = await fetch('/api/movies/search?query=' + encodeURIComponent(term));
            const movies = await res.json();
            searchResults.innerHTML = '';
            if (!movies.length) {
              searchResults.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No movies found</div>';
              searchResults.classList.remove('hidden');
              return;
            }
            movies.forEach(m => {
              const a = document.createElement('a');
              a.href = `./movie.html?id=${m.id}`;
              a.className = 'block px-4 py-2 hover:bg-slate-800/60 text-sm';
              a.innerHTML = `<span class="font-medium">${m.title}</span> <span class="text-xs text-slate-400">(${m.release_year||''})</span>`;
              searchResults.appendChild(a);
            });
            searchResults.classList.remove('hidden');
          } catch {}
        }, 300);
      });
    }
    if (notifBtn) {
      notifBtn.addEventListener('click', async () => {
        notifDropdown.classList.toggle('hidden');
        if (!notifDropdown.classList.contains('hidden')) { await loadNotifications(); }
      });
    }
    async function loadNotifications() {
      const list = document.getElementById('notifList');
      try {
        const res = await fetch('/api/notifications?unread=true');
        const notifs = await res.json();
        list.innerHTML = '';
        if (!notifs.length) {
          list.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No new notifications</div>';
          document.getElementById('notifBadge').classList.add('hidden');
          return;
        }
        const badge = document.getElementById('notifBadge');
        badge.textContent = Math.min(notifs.length, 9);
        badge.classList.remove('hidden');
        notifs.slice(0, 5).forEach(n => {
          const div = document.createElement('div');
          div.className = 'px-4 py-3 hover:bg-slate-700/40 cursor-pointer text-sm';
          div.innerHTML = `<p>${n.message}</p><p class="text-xs text-slate-400 mt-1">${new Date(n.created_date.replace(' ','T')).toLocaleString()}</p>`;
          div.addEventListener('click', async () => {
            await fetch(`/api/notifications/${n.id}/seen`, { method: 'POST' });
            await loadNotifications();
          });
          list.appendChild(div);
        });
      } catch {}
    }
    if (profileBtn) { profileBtn.addEventListener('click', () => profileDropdown.classList.toggle('hidden')); }
    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        const user = await res.json();
        document.getElementById('profileName').textContent = user.name || 'User';
        document.getElementById('profileEmail').textContent = user.email || '';
        const avatar = document.getElementById('profileAvatar');
        const initials = (user.name||'U').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
        avatar.textContent = initials;
        await loadNotifications();
      } catch {}
    })();
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        alert('Logout functionality - redirect to login page');
      });
    }
    document.addEventListener('click', (e) => {
      if (!notifBtn.contains(e.target) && !notifDropdown.contains(e.target)) { notifDropdown.classList.add('hidden'); }
      if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) { profileDropdown.classList.add('hidden'); }
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) { searchResults.classList.add('hidden'); }
    });
  })();
  </script>
</body>
</html>
