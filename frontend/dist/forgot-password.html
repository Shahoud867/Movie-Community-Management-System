<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password — Movie Community</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex flex-col">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-brand-600 text-white px-3 py-2 rounded">Skip to content</a>
  <header class="w-full border-b border-slate-800/60">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="./dashboard.html" class="flex items-center gap-2 group">
        <div class="h-10 w-10 bg-brand-600 rounded flex items-center justify-center font-bold text-white">MC</div>
        <span class="font-semibold tracking-wide">Movie Community</span>
      </a>
      <nav class="text-sm text-slate-300"><span class="opacity-60">Reset password</span></nav>
    </div>
  </header>
  <main id="main" class="flex-1 grid place-items-center px-4 py-12">
    <div class="w-full max-w-md mx-auto bg-slate-800/60 backdrop-blur rounded-xl border border-slate-700/60 p-6 shadow-lg">
      <h1 class="text-xl font-semibold tracking-wide mb-2">Reset your password</h1>
      <p class="text-sm text-slate-300 mb-5">Enter your email and we'll send you a link to reset it.</p>
      <form id="forgotForm" class="space-y-4" novalidate>
        <div>
          <label for="email" class="block text-sm font-medium mb-1">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" class="w-full rounded-md bg-slate-900/80 border border-slate-700 focus:border-brand-500 focus:ring-brand-500 px-3 py-2 text-sm" placeholder="you@example.com" />
        </div>
        <div id="forgotAlerts" class="space-y-2"></div>
        <button type="submit" id="forgotSubmit" class="w-full inline-flex items-center justify-center gap-2 rounded-md bg-brand-600 hover:bg-brand-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500 px-4 py-2.5 text-sm font-medium disabled:opacity-50 disabled:pointer-events-none transition-colors">
          <span class="submit-label">Send Reset Link</span>
          <svg class="animate-spin h-4 w-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
        </button>
        <p class="text-center text-sm text-slate-400">Remembered your password? <a href="./login.html" class="text-brand-400 hover:text-brand-300 font-medium">Login</a></p>
      </form>
    </div>
  </main>
  <footer class="mt-auto border-t border-slate-800/60">
    <div class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-400 flex flex-wrap gap-4">
      <span>&copy; 2025 Movie Community</span>
      <span class="opacity-70">All rights reserved.</span>
      <span class="opacity-70">Section 1.4 — Forgot Password</span>
    </div>
  </footer>
  <script>
  function alertBox(type, msg) {
    const base = 'rounded px-3 py-2 text-sm';
    const tone = {
      success: 'bg-green-600/20 text-green-300 border border-green-600/40',
      error: 'bg-red-600/20 text-red-300 border border-red-600/40',
      info: 'bg-slate-600/30 text-slate-200 border border-slate-500/40'
    }[type] || tone.info;
    const el = document.createElement('div');
    el.className = base + ' ' + tone;
    el.textContent = text;
    return el;
  }
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('forgotForm');
    const alerts = document.getElementById('forgotAlerts');
    const btn = document.getElementById('forgotSubmit');
    const spinner = btn.querySelector('svg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alerts.innerHTML = '';
      const email = form.email.value.trim();
      if (!email) {
        alerts.appendChild(alertBox('error', 'Email is required.'));
        return;
      }
      btn.disabled = true; spinner.classList.remove('hidden');
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.message || 'Failed to send reset link');
        }
        alerts.appendChild(alertBox('success', 'Reset link sent if email exists. Check your inbox.'));
        form.reset();
      } catch (err) {
        alerts.appendChild(alertBox('error', err.message));
      } finally {
        btn.disabled = false; spinner.classList.add('hidden');
      }
    });
  });
  </script>
</body>
</html>
