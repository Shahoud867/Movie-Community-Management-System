<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notifications • Movie Community</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="description" content="All your notifications in one place." />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f9ff',
              100: '#e6f0ff',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af'
            },
            surface: '#0f172a'
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex flex-col">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-brand-600 text-white px-3 py-2 rounded">Skip to content</a>

  <!-- Navbar Component -->
  <div id="navbar-container"></div>

  <main id="main" class="flex-1 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="max-w-6xl mx-auto px-4 py-8 space-y-6">
      <!-- Header Card -->
      <div class="bg-gradient-to-r from-brand-600 to-brand-700 rounded-xl p-6 shadow-lg border border-brand-500/20">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white">Notifications</h1>
            <p class="text-sm text-brand-50/90 mt-1">Stay updated with your latest activity</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="markAllBtn" class="text-sm px-4 py-2 rounded-lg bg-white/10 backdrop-blur border border-white/20 hover:bg-white/20 disabled:opacity-50 disabled:cursor-not-allowed text-white transition-all shadow-lg hover:shadow-xl disabled:hover:shadow-lg">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Mark all as read
              </span>
            </button>
            <button id="refreshBtn" class="text-sm px-4 py-2 rounded-lg bg-white/10 backdrop-blur border border-white/20 hover:bg-white/20 text-white transition-all shadow-lg hover:shadow-xl">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Refresh
              </span>
            </button>
          </div>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center gap-3">
        <button data-filter="all" class="filter-tab px-5 py-2.5 rounded-lg font-medium transition-all shadow-md bg-brand-600 text-white border border-brand-500/30">
          <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
            All Notifications
          </span>
        </button>
        <button data-filter="unread" class="filter-tab px-5 py-2.5 rounded-lg font-medium transition-all shadow-md bg-slate-800/60 text-slate-300 hover:bg-slate-700/60 border border-slate-700/60">
          <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            Unread Only
          </span>
        </button>
      </div>

      <!-- Notifications List -->
      <section aria-label="Notifications list" class="bg-slate-800/40 backdrop-blur rounded-xl border border-slate-700/60 shadow-xl overflow-hidden">
        <ul id="notificationsList" class="divide-y divide-slate-700/60">
          <li class="px-6 py-8 text-center">
            <div class="inline-flex items-center gap-2 text-slate-400">
              <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Loading notifications...
            </div>
          </li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="mt-auto border-t border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-400 flex flex-wrap gap-4">
      <span>&copy; 2025 Movie Community</span>
      <span class="opacity-70">All rights reserved.</span>
    </div>
  </footer>

  <!-- API Integration: Connect to backend when ready -->
  <script>
  let currentFilter = 'all';
  let notifications = [];

  async function apiFetch(url, options = {}) {
    const res = await fetch(url, { credentials: 'include', ...options });
    if (res.status === 401) {
      window.location.href = './login.html';
      throw new Error('Unauthorized');
    }
    if (!res.ok) throw new Error('Request failed');
    return res.json();
  }

  async function loadNotifications() {
    const root = document.getElementById('notificationsList');
    root.innerHTML = '<li class="px-6 py-8 text-center text-slate-400">Loading notifications...</li>';
    
    try {
      notifications = await apiFetch('/api/notifications');
      renderNotifications();
    } catch (err) {
      console.error('Failed to load notifications:', err);
      root.innerHTML = '<li class="px-6 py-8 text-center text-red-400">Error loading notifications</li>';
    }
  }

  function renderNotifications() {
    const root = document.getElementById('notificationsList');
    
    let filtered = notifications;
    if (currentFilter === 'unread') {
      filtered = notifications.filter(n => !n.is_seen);
    }
    
    if (filtered.length === 0) {
      root.innerHTML = '<li class="px-6 py-12 text-center"><div class="flex flex-col items-center gap-3 text-slate-400"><svg class="w-16 h-16 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg><p class="text-lg font-medium">No notifications</p></div></li>';
      return;
    }
    
    root.innerHTML = '';
    filtered.forEach(notif => {
      root.appendChild(createNotificationItem(notif));
    });
  }

  function createNotificationItem(notif) {
    const li = document.createElement('li');
    li.className = `px-6 py-4 hover:bg-slate-700/30 transition-colors ${!notif.is_seen ? 'bg-slate-800/60' : ''}`;
    
    const iconMap = {
      friend_request: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z"></path></svg>',
      friend_accept: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"></path></svg>',
      like: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>',
      comment: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"></path></svg>',
      review_reply: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 5a2 2 0 012-2h7a2 2 0 012 2v4a2 2 0 01-2 2H9l-3 3v-3H4a2 2 0 01-2-2V5z"></path><path d="M15 7v2a4 4 0 01-4 4H9.828l-1.766 1.767c.28.149.599.233.938.233h2l3 3v-3h2a2 2 0 002-2V9a2 2 0 00-2-2h-1z"></path></svg>',
      event_invite: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path></svg>',
    };
    
    const icon = iconMap[notif.notification_type] || iconMap.comment;
    const timeAgo = getTimeAgo(new Date(notif.created_date));
    
    li.innerHTML = `
      <div class="flex items-start gap-4">
        <div class="shrink-0 h-10 w-10 rounded-full bg-brand-600/20 flex items-center justify-center text-brand-400">
          ${icon}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm text-slate-200">${notif.message || 'New notification'}</p>
          <p class="text-xs text-slate-400 mt-1">${timeAgo}</p>
        </div>
        ${!notif.is_seen ? '<span class="shrink-0 h-2 w-2 rounded-full bg-brand-500"></span>' : ''}
        <button class="shrink-0 p-2 text-slate-400 hover:text-slate-200" onclick="deleteNotification(${notif.notification_id})">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    `;
    
    if (!notif.is_seen) {
      li.addEventListener('click', () => markAsSeen(notif.notification_id));
    }
    
    return li;
  }

  function getTimeAgo(date) {
    const seconds = Math.floor((new Date() - date) / 1000);
    if (seconds < 60) return 'Just now';
    if (seconds < 3600) return Math.floor(seconds / 60) + ' minutes ago';
    if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
    if (seconds < 604800) return Math.floor(seconds / 86400) + ' days ago';
    return date.toLocaleDateString();
  }

  async function markAsSeen(notificationId) {
    try {
      await apiFetch(`/api/notifications/${notificationId}/seen`, { method: 'PATCH' });
      const notif = notifications.find(n => n.notification_id === notificationId);
      if (notif) notif.is_seen = true;
      renderNotifications();
    } catch (err) {
      console.error('Failed to mark as seen:', err);
    }
  }

  async function deleteNotification(notificationId) {
    try {
      await apiFetch(`/api/notifications/${notificationId}`, { method: 'DELETE' });
      notifications = notifications.filter(n => n.notification_id !== notificationId);
      renderNotifications();
    } catch (err) {
      console.error('Failed to delete notification:', err);
    }
  }

  async function markAllAsSeen() {
    try {
      await apiFetch('/api/notifications/mark-all-seen', { method: 'PATCH' });
      notifications.forEach(n => n.is_seen = true);
      renderNotifications();
    } catch (err) {
      console.error('Failed to mark all as seen:', err);
    }
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', async () => {
    // Load navbar component first
    try {
      const response = await fetch('/components/navbar-enhanced.html');
      const html = await response.text();
      document.getElementById('navbar-container').innerHTML = html;
      
      // Execute the navbar script manually since innerHTML doesn't execute scripts
      const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/);
      if (scriptMatch) {
        const scriptContent = scriptMatch[1];
        const scriptEl = document.createElement('script');
        scriptEl.textContent = scriptContent;
        document.body.appendChild(scriptEl);
      }
    } catch (error) {
      console.error('Failed to load navbar:', error);
    }

    // Wait a bit for navbar to load
    await new Promise(resolve => setTimeout(resolve, 100));
    
    // Load notifications
    loadNotifications();
    
    document.getElementById('markAllBtn').addEventListener('click', markAllAsSeen);
    document.getElementById('refreshBtn').addEventListener('click', loadNotifications);
    
    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter || 'all';
        document.querySelectorAll('.filter-tab').forEach(b => {
          b.classList.remove('bg-brand-600','text-white','border-brand-500/30','shadow-lg');
          b.classList.add('bg-slate-800/60','text-slate-300','hover:bg-slate-700/60','border-slate-700/60','shadow-md');
        });
        btn.classList.add('bg-brand-600','text-white','border-brand-500/30','shadow-lg');
        btn.classList.remove('bg-slate-800/60','text-slate-300','hover:bg-slate-700/60','border-slate-700/60');
        renderNotifications();
      });
    });
  });
  </script>
</body>
</html>
