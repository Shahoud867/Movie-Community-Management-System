<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Watchlist — Movie Community</title>
  <meta name="description" content="Manage your full watchlist: to-watch, watching, completed." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f5f9ff', 100: '#e6f0ff', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af' }
          }
        }
      }
    };
  </script>
  <style>
    .tab-active {
      background-color: rgba(37, 99, 235, 0.15);
      color: #93c5fd;
      border-color: rgba(37, 99, 235, .4)
    }
  </style>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex flex-col">
  <a href="#main"
    class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-brand-600 text-white px-3 py-2 rounded">Skip
    to content</a>
  <header class="w-full border-b border-slate-800/60 bg-slate-900">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="./dashboard.html" class="flex items-center gap-2 shrink-0 group">
        <div
          class="h-10 w-10 bg-brand-600 rounded flex items-center justify-center font-bold text-white group-hover:bg-brand-700 transition-colors">
          MC</div>
        <span class="hidden sm:inline font-semibold tracking-wide">Movie Community</span>
      </a>
      <div class="flex-1 max-w-md relative">
        <input id="globalSearch" type="search" placeholder="Search movies..."
          class="w-full rounded-md bg-slate-800/60 border border-slate-700 px-3 py-2 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-600"
          autocomplete="off" />
        <div id="searchResults"
          class="absolute z-50 mt-1 w-full bg-slate-900/95 border border-slate-700/80 rounded-md shadow-lg hidden max-h-80 overflow-y-auto">
        </div>
      </div>
      <nav class="hidden lg:flex items-center gap-4 text-sm text-slate-300">
        <a href="./movies.html" class="hover:text-white transition-colors">Movies</a>
        <a href="./watchlist.html" class="hover:text-white transition-colors">Watchlist</a>
        <a href="./events.html" class="hover:text-white transition-colors">Events</a>
        <a href="./messages.html" class="hover:text-white transition-colors">Messages</a>
        <a href="./friends.html" class="hover:text-white transition-colors">Friends</a>
      </nav>
      <div class="relative">
        <button id="notifBtn" class="relative p-2 rounded-md hover:bg-slate-800/60 transition-colors"
          aria-label="Notifications">
          <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
            </path>
          </svg>
          <span id="notifBadge"
            class="hidden absolute top-0 right-0 h-4 w-4 bg-red-500 rounded-full text-[10px] font-bold flex items-center justify-center text-white"></span>
        </button>
        <div id="notifDropdown"
          class="hidden absolute right-0 mt-2 w-80 bg-slate-800/95 backdrop-blur border border-slate-700/80 rounded-md shadow-lg max-h-96 overflow-y-auto z-50">
          <div class="px-4 py-2 border-b border-slate-700/60 flex items-center justify-between">
            <span class="text-sm font-semibold">Notifications</span>
            <a href="./notifications.html" class="text-xs text-brand-400 hover:text-brand-300">View All</a>
          </div>
          <div id="notifList" class="divide-y divide-slate-700/60">
            <div class="px-4 py-3 text-sm text-slate-400">Loading...</div>
          </div>
        </div>
      </div>
      <div class="relative">
        <button id="profileBtn"
          class="flex items-center gap-2 p-1.5 rounded-md hover:bg-slate-800/60 transition-colors">
          <div id="profileAvatar"
            class="h-8 w-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-semibold">U</div>
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
        <div id="profileDropdown"
          class="hidden absolute right-0 mt-2 w-48 bg-slate-800/95 backdrop-blur border border-slate-700/80 rounded-md shadow-lg z-50">
          <div class="px-4 py-2 border-b border-slate-700/60">
            <p id="profileName" class="text-sm font-medium">User</p>
            <p id="profileEmail" class="text-xs text-slate-400">user@example.com</p>
          </div>
          <div class="py-1">
            <a href="./profile.html?id=me" class="block px-4 py-2 text-sm hover:bg-slate-700/60 transition-colors">My
              Profile</a>
            <a href="./settings.html"
              class="block px-4 py-2 text-sm hover:bg-slate-700/60 transition-colors">Settings</a>
            <button id="logoutBtn"
              class="block w-full text-left px-4 py-2 text-sm hover:bg-slate-700/60 transition-colors text-red-400">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="flex-1">
    <div class="max-w-7xl mx-auto px-4 py-8 space-y-6">
      <section class="space-y-2">
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight">My Watchlist</h1>
        <p class="text-slate-300 text-sm">Organize movies you plan to watch, are watching, and completed.</p>
      </section>

      <section aria-labelledby="tabs" class="space-y-4">
        <div class="flex items-center gap-2">
          <button id="btn_to_watch" data-tab="to-watch"
            class="px-3 py-1.5 rounded-md border border-slate-700 bg-slate-800 text-slate-200 hover:border-brand-600 transition-colors">To-Watch</button>
          <button id="btn_watching" data-tab="watching"
            class="px-3 py-1.5 rounded-md border border-slate-700 bg-slate-800 text-slate-200 hover:border-brand-600 transition-colors">Watching</button>
          <button id="btn_completed" data-tab="completed"
            class="px-3 py-1.5 rounded-md border border-slate-700 bg-slate-800 text-slate-200 hover:border-brand-600 transition-colors">Completed</button>
        </div>

        <div id="tab_to_watch" class="space-y-3 hidden" aria-live="polite"></div>
        <div id="tab_watching" class="space-y-3 hidden" aria-live="polite"></div>
        <div id="tab_completed" class="space-y-3 hidden" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <footer class="mt-auto border-t border-slate-800/60">
    <div class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-400 flex flex-wrap gap-4">
      <span>&copy; 2025 Movie Community</span>
      <span class="opacity-70">All rights reserved.</span>
      <span class="opacity-70">Watchlist 1.0</span>
    </div>
  </footer>

  <script>
    // Utility fetch wrapper
    async function apiFetch(url, options = {}) {
      const res = await fetch(url, { ...options, credentials: 'include' });
      if (!res.ok) throw new Error('Request failed');
      return res.json();
    }

    // Debounce utility
    const debounce = (fn, wait = 500) => {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
    };

    // --- Watchlist Logic ---

    function moveDropdown(movieId, current) {
      const wrapper = document.createElement('div');
      wrapper.className = 'text-xs';
      wrapper.innerHTML = `
        <label class="sr-only" for="move_${movieId}">Move to</label>
        <select id="move_${movieId}" data-movie-id="${movieId}" class="w-full rounded-md bg-slate-800 border border-slate-700 text-xs px-2 py-1 focus:border-brand-600 text-slate-200">
          <option value="to-watch" ${current === 'to-watch' ? 'selected' : ''}>To-Watch</option>
          <option value="watching" ${current === 'watching' ? 'selected' : ''}>Watching</option>
          <option value="completed" ${current === 'completed' ? 'selected' : ''}>Completed</option>
          <option value="remove">Remove</option>
        </select>`;
      return wrapper;
    }

    async function updateStatus(movieId, status) {
      if (status === 'remove') {
        if (!confirm('Remove this movie from your watchlist?')) return;
        await apiFetch(`/api/watchlist/${movieId}`, { method: 'DELETE' });
      } else {
        await apiFetch(`/api/watchlist/${movieId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
      }
    }

    async function updateProgress(movieId, progress) {
      await apiFetch(`/api/watchlist/${movieId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ progress_percent: Math.max(0, Math.min(100, Number(progress))) })
      });
    }

    function posterBox(movie) {
      const d = document.createElement('div');
      d.className = 'group relative aspect-[2/3] rounded-lg overflow-hidden bg-slate-800 border border-slate-700/60 hover:border-brand-600/60 transition-colors';
      const poster = movie.poster_url && !movie.poster_url.includes('null')
        ? `<img src="${movie.poster_url}" alt="${movie.title}" class="w-full h-full object-cover" />`
        : `<div class="absolute inset-0 flex items-center justify-center text-xs text-slate-400">Poster</div>`;

      d.innerHTML = `
        ${poster}
        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-900/90 to-transparent p-3 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
          <a href="./movie.html?id=${movie.movie_id}" class="text-xs font-bold text-white hover:underline line-clamp-2">${movie.title || 'Untitled'}</a>
          <div class="mt-2">
             ${moveDropdown(movie.movie_id, 'completed').innerHTML}
          </div>
        </div>`;
      // Re-attach event listener logic for the innerHTML dropdown is tricky, 
      // so we rely on global delegation in the main setup.
      return d;
    }

    function listRow(movie, status) {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-3 rounded-md border border-slate-700/60 bg-slate-800 p-3 hover:border-slate-600 transition-colors';
      const poster = movie.poster_url && !movie.poster_url.includes('null')
        ? `<img src="${movie.poster_url}" alt="${movie.title}" class="w-full h-full object-cover rounded" />`
        : `<div class="w-full h-full flex items-center justify-center text-[10px] text-slate-400">Poster</div>`;

      row.innerHTML = `
        <div class="h-16 w-12 shrink-0 rounded bg-slate-700 overflow-hidden">
          ${poster}
        </div>
        <div class="flex-1 min-w-0">
          <a href="./movie.html?id=${movie.movie_id}" class="text-sm font-medium hover:text-brand-400 transition-colors truncate block">${movie.title || 'Untitled'}</a>
          <p class="text-[11px] text-slate-400">${movie.release_year || ''} • ${movie.average_rating ? '★ ' + movie.average_rating : 'No rating'}</p>
        </div>`;

      const controls = document.createElement('div');
      controls.className = 'w-32 shrink-0';
      controls.appendChild(moveDropdown(movie.movie_id, status));
      row.appendChild(controls);
      return row;
    }

    function watchingRow(movie, status, progress) {
      const row = listRow(movie, status);
      // Inject progress slider
      const right = document.createElement('div');
      right.className = 'flex items-center gap-3 w-full sm:w-auto mt-2 sm:mt-0 sm:ml-4 border-t sm:border-t-0 border-slate-700/50 pt-2 sm:pt-0';
      right.innerHTML = `
        <div class="flex flex-col w-full sm:w-40">
            <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                <span>Progress</span>
                <span data-range-label-for="${movie.movie_id}">${Number(progress) || 0}%</span>
            </div>
            <input type="range" min="0" max="100" value="${Number(progress) || 0}" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-brand-500" data-range-for="${movie.movie_id}">
        </div>`;

      // Append to the flex container (need to adjust listRow structure slightly or append to end)
      // listRow returns a flex row. We want the slider to be part of it.
      // Let's just append it to the end.
      row.appendChild(right);
      // Make row wrap on small screens
      row.classList.add('flex-wrap', 'sm:flex-nowrap');
      return row;
    }

    async function loadTab(status) {
      const containerMap = {
        'to-watch': document.getElementById('tab_to_watch'),
        'watching': document.getElementById('tab_watching'),
        'completed': document.getElementById('tab_completed')
      };
      const root = containerMap[status];
      if (!root) return;

      root.innerHTML = '<div class="animate-pulse space-y-3"><div class="h-16 bg-slate-800 rounded"></div><div class="h-16 bg-slate-800 rounded"></div></div>';

      try {
        const items = await apiFetch(`/api/watchlist?status=${encodeURIComponent(status)}`);
        root.innerHTML = '';

        if (!items.length) {
          root.innerHTML = `
            <div class="text-center py-12 border border-dashed border-slate-700 rounded-lg">
                <p class="text-slate-400 mb-2">No movies in this list.</p>
                <a href="./movies.html" class="text-sm text-brand-400 hover:text-brand-300 font-medium">Browse Movies &rarr;</a>
            </div>`;
          return;
        }

        if (status === 'completed') {
          const grid = document.createElement('div');
          grid.className = 'grid gap-4 grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6';
          items.forEach(w => grid.appendChild(posterBox(w)));
          root.appendChild(grid);
        } else if (status === 'watching') {
          const list = document.createElement('div');
          list.className = 'space-y-3';
          items.forEach(w => list.appendChild(watchingRow(w, 'watching', w.progress_percent || 0)));
          root.appendChild(list);
        } else { // to-watch
          const list = document.createElement('div');
          list.className = 'space-y-3';
          items.forEach(w => list.appendChild(listRow(w, 'to-watch')));
          root.appendChild(list);
        }
      } catch (e) {
        console.error(e);
        root.innerHTML = '<p class="text-sm text-red-400">Failed to load watchlist. Please try again.</p>';
      }
    }

    function setActiveTab(tab) {
      const tabs = document.querySelectorAll('[data-tab]');
      tabs.forEach(t => {
        const isActive = t.dataset.tab === tab;
        t.classList.toggle('tab-active', isActive);
        t.classList.toggle('text-brand-400', isActive);
        t.classList.toggle('text-slate-200', !isActive);
        t.classList.toggle('border-brand-600', isActive);
        t.classList.toggle('border-slate-700', !isActive);
      });

      document.getElementById('tab_to_watch').classList.toggle('hidden', tab !== 'to-watch');
      document.getElementById('tab_watching').classList.toggle('hidden', tab !== 'watching');
      document.getElementById('tab_completed').classList.toggle('hidden', tab !== 'completed');
    }

    // --- Global Init & Event Delegation ---

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. User & Notifications
      try {
        const user = await apiFetch('/api/auth/me');
        document.getElementById('profileName').textContent = user.name || 'User';
        document.getElementById('profileEmail').textContent = user.email || '';
        const avatar = document.getElementById('profileAvatar');
        const initials = (user.name || 'U').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
        avatar.textContent = initials;

        // Load notifications
        await loadNotifications();
      } catch (e) {
        console.error('Auth check failed', e);
        // window.location.href = '/login.html'; // Optional: redirect if not logged in
      }

      // 2. Tab Handlers
      document.getElementById('btn_to_watch').addEventListener('click', () => { setActiveTab('to-watch'); loadTab('to-watch'); });
      document.getElementById('btn_watching').addEventListener('click', () => { setActiveTab('watching'); loadTab('watching'); });
      document.getElementById('btn_completed').addEventListener('click', () => { setActiveTab('completed'); loadTab('completed'); });

      // 3. Global Event Delegation

      // Move/Remove Dropdown Change
      document.addEventListener('change', async (e) => {
        if (e.target.matches('select[id^="move_"]')) {
          const select = e.target;
          constmovieId = Number(select.dataset.movieId); // Typo fixed in next line logic
          const movieId = Number(select.dataset.movieId);
          const newStatus = select.value;

          // Disable temporarily
          select.disabled = true;
          try {
            await updateStatus(movieId, newStatus);
            // Reload all tabs to reflect changes (item moves from one to another)
            await Promise.all([loadTab('to-watch'), loadTab('watching'), loadTab('completed')]);
          } catch (err) {
            console.error(err);
            alert('Failed to update status');
            select.disabled = false;
          }
        }
      });

      // Progress Slider Input
      const debouncedProgress = debounce(updateProgress, 500);
      document.addEventListener('input', (e) => {
        if (e.target.matches('input[type=range][data-range-for]')) {
          const range = e.target;
          const movieId = Number(range.dataset.rangeFor);
          const label = document.querySelector(`[data-range-label-for="${movieId}"]`);
          if (label) label.textContent = `${range.value}%`;
          debouncedProgress(movieId, Number(range.value));
        }
      });

      // Logout
      document.getElementById('logoutBtn')?.addEventListener('click', async () => {
        try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch { }
        window.location.href = '/login.html';
      });

      // Global Search
      let searchTimer;
      const searchInput = document.getElementById('globalSearch');
      const searchResults = document.getElementById('searchResults');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const term = e.target.value.trim();
          if (searchTimer) clearTimeout(searchTimer);
          if (!term) { searchResults.classList.add('hidden'); return; }
          searchTimer = setTimeout(async () => {
            try {
              const movies = await apiFetch('/api/movies/search?query=' + encodeURIComponent(term));
              searchResults.innerHTML = '';
              if (!movies.length) {
                searchResults.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No movies found</div>';
              } else {
                movies.forEach(m => {
                  const a = document.createElement('a');
                  a.href = `./movie.html?id=${m.id}`;
                  a.className = 'block px-4 py-2 hover:bg-slate-800/60 text-sm';
                  a.innerHTML = `<span class="font-medium">${m.title}</span> <span class="text-xs text-slate-400">(${m.release_year || ''})</span>`;
                  searchResults.appendChild(a);
                });
              }
              searchResults.classList.remove('hidden');
            } catch { }
          }, 300);
        });
      }

      // Notifications Toggle
      const notifBtn = document.getElementById('notifBtn');
      const notifDropdown = document.getElementById('notifDropdown');
      if (notifBtn) {
        notifBtn.addEventListener('click', async () => {
          notifDropdown.classList.toggle('hidden');
          if (!notifDropdown.classList.contains('hidden')) await loadNotifications();
        });
      }

      // Profile Toggle
      const profileBtn = document.getElementById('profileBtn');
      const profileDropdown = document.getElementById('profileDropdown');
      if (profileBtn) {
        profileBtn.addEventListener('click', () => profileDropdown.classList.toggle('hidden'));
      }

      // Close dropdowns on click outside
      document.addEventListener('click', (e) => {
        if (notifBtn && !notifBtn.contains(e.target) && !notifDropdown.contains(e.target)) notifDropdown.classList.add('hidden');
        if (profileBtn && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) profileDropdown.classList.add('hidden');
        if (searchInput && !searchInput.contains(e.target) && !searchResults.contains(e.target)) searchResults.classList.add('hidden');
      });

      // Initial Load
      setActiveTab('watching');
      loadTab('watching');
      loadTab('to-watch');
      loadTab('completed');
    });

    async function loadNotifications() {
      const list = document.getElementById('notifList');
      try {
        const notifs = await apiFetch('/api/notifications?unread=true');
        list.innerHTML = '';
        if (!notifs.length) {
          list.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No new notifications</div>';
          document.getElementById('notifBadge').classList.add('hidden');
          return;
        }
        const badge = document.getElementById('notifBadge');
        badge.textContent = Math.min(notifs.length, 9);
        badge.classList.remove('hidden');
        notifs.slice(0, 5).forEach(n => {
          const div = document.createElement('div');
          div.className = 'px-4 py-3 hover:bg-slate-700/40 cursor-pointer text-sm';
          div.innerHTML = `<p>${n.message}</p><p class="text-xs text-slate-400 mt-1">${new Date(n.created_date).toLocaleString()}</p>`;
          div.addEventListener('click', async () => {
            await fetch(`/api/notifications/${n.id}/seen`, { method: 'POST', credentials: 'include' });
            await loadNotifications();
          });
          list.appendChild(div);
        });
      } catch { }
    }
  </script>
</body>

</html>
