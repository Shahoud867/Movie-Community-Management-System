<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Keep brand colors consistent with the rest of the app
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f9ff',
              100: '#e6f0ff',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
            },
          },
        },
      },
    };
  </script>
  <style>
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
    }
  </style>
</head>

<body
  class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-800/60 border border-slate-700 rounded-xl p-8 shadow-2xl">
    <!-- Header with subtle animation -->
    <header class="text-center mb-6">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white animate-fade-in-up">
        Admin Registration
      </h1>
    </header>

    <form id="registerForm" class="space-y-5">
      <div>
        <label class="block text-sm text-slate-300 mb-1" for="name">Name</label>
        <input type="text" id="name" name="name" required
          class="w-full px-4 py-2 bg-slate-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-brand-600" />
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1" for="email">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full px-4 py-2 bg-slate-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-brand-600" />
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1" for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6"
          class="w-full px-4 py-2 bg-slate-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-brand-600" />
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1" for="role">Role</label>
        <select id="role" name="role"
          class="w-full px-4 py-2 bg-slate-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-brand-600">
          <option value="moderator">Moderator</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="flex items-center">
        <input type="checkbox" id="superAdmin" name="is_super_admin"
          class="h-4 w-4 text-brand-600 bg-slate-700 border-slate-600 rounded focus:ring-brand-600" />
        <label class="ml-2 text-sm text-slate-300" for="superAdmin">Super Admin</label>
      </div>
      <div class="flex justify-between items-center mt-4">
        <button type="submit"
          class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2 rounded transition-colors shadow">
          Register
        </button>
        <a href="login.html" class="text-sm text-brand-400 hover:text-brand-300">← Back to Sign‑In</a>
      </div>
    </form>
  </div>

  <script>
    // CSP‑compliant event handling using delegation
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const payload = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        role: form.role.value,
        is_super_admin: form.is_super_admin.checked,
      };

      try {
        const response = await fetch('/api/admin/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const err = await response.text();
          throw new Error(err || 'Registration failed');
        }

        // Successful registration – redirect to admin login
        window.location.href = 'login.html';
      } catch (err) {
        console.error('Admin registration error:', err);
        alert(err.message || 'An unexpected error occurred');
      }
    });
  </script>
</body>

</html>
