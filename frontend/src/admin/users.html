<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • User Management</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex">
  <div id="sidebar"></div>
  <main class="flex-1 min-w-0">
    <header class="border-b border-slate-800/60 px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-semibold">User Management</h1>
      <a class="text-sm text-brand-400 hover:text-brand-300" href="../dashboard.html">← Back to App</a>
    </header>
    <section class="p-4">
      <div class="mb-3 flex gap-2 items-center">
        <input id="search" class="bg-slate-800/60 border border-slate-700 rounded px-3 py-2 text-sm flex-1 max-w-md"
          placeholder="Search users by name or email" />
        <button id="refreshBtn" class="bg-brand-600 hover:bg-brand-500 rounded px-3 py-2 text-sm">Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-slate-400 border-b border-slate-800">
            <tr>
              <th class="text-left py-2 px-2">User ID</th>
              <th class="text-left py-2 px-2">Name</th>
              <th class="text-left py-2 px-2">Email</th>
              <th class="text-left py-2 px-2">Joined Date</th>
              <th class="text-left py-2 px-2">Status</th>
              <th class="text-left py-2 px-2">Actions</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    (async function () {
      const sidebar = await fetch('../components/admin-sidebar.html').then(r => r.text());
      document.getElementById('sidebar').innerHTML = sidebar;

      let editingId = null;

      async function load() {
        const rows = document.getElementById('rows');
        const searchQuery = document.getElementById('search').value;

        try {
          rows.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-slate-400">Loading users...</td></tr>';

          const url = searchQuery
            ? `/api/admin/users?search=${encodeURIComponent(searchQuery)}`
            : '/api/admin/users';

          const response = await fetch(url, { credentials: 'include' });

          if (!response.ok) {
            throw new Error('Failed to load users');
          }

          const users = await response.json();

          if (users.length === 0) {
            rows.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-slate-400">No users found</td></tr>';
            return;
          }

          rows.innerHTML = users.map(user => {
            const joinedDate = new Date(user.joined_date).toLocaleDateString();
            const statusBadge = user.is_active
              ? '<span class="px-2 py-1 bg-green-900/30 text-green-400 rounded text-xs">Active</span>'
              : '<span class="px-2 py-1 bg-red-900/30 text-red-400 rounded text-xs">Inactive</span>';

            if (editingId === user.user_id) {
              return `<tr class="bg-slate-800/40">
                <td class="py-2 px-2">${user.user_id}</td>
                <td class="py-2 px-2"><input id="editName" value="${user.name}" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm w-full"/></td>
                <td class="py-2 px-2"><input id="editEmail" value="${user.email}" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm w-full"/></td>
                <td class="py-2 px-2">${joinedDate}</td>
                <td class="py-2 px-2">${statusBadge}</td>
                <td class="py-2 px-2">
                  <button data-action="save" data-id="${user.user_id}" class="text-green-400 hover:text-green-300 text-xs mr-2">Save</button>
                  <button data-action="cancel" class="text-slate-400 hover:text-slate-300 text-xs">Cancel</button>
                </td>
              </tr>`;
            }

            return `<tr class="hover:bg-slate-800/20">
              <td class="py-2 px-2">${user.user_id}</td>
              <td class="py-2 px-2">${user.name}</td>
              <td class="py-2 px-2">${user.email}</td>
              <td class="py-2 px-2">${joinedDate}</td>
              <td class="py-2 px-2">${statusBadge}</td>
              <td class="py-2 px-2">
                <button data-action="edit" data-id="${user.user_id}" class="text-brand-400 hover:text-brand-300 text-xs mr-2">Edit</button>
                <button data-action="toggle" data-id="${user.user_id}" data-active="${!!user.is_active}" class="text-yellow-400 hover:text-yellow-300 text-xs mr-2">${user.is_active ? 'Deactivate' : 'Activate'}</button>
                <button data-action="delete" data-id="${user.user_id}" class="text-red-400 hover:text-red-300 text-xs">Delete</button>
              </td>
            </tr>`;
          }).join('');

        } catch (error) {
          console.error('Load users error:', error);
          rows.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-red-400">Failed to load users. Please ensure you are logged in as admin.</td></tr>';
        }
      }

      // Event delegation for all button clicks
      document.getElementById('rows').addEventListener('click', async (e) => {
        const button = e.target.closest('button[data-action]');
        if (!button) return;

        const action = button.dataset.action;
        const id = button.dataset.id;

        if (action === 'edit') {
          editingId = parseInt(id);
          load();
        } else if (action === 'cancel') {
          editingId = null;
          load();
        } else if (action === 'save') {
          const name = document.getElementById('editName').value;
          const email = document.getElementById('editEmail').value;

          if (!name || !email) {
            alert('Name and email are required');
            return;
          }

          try {
            const response = await fetch(`/api/admin/users/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ name, email })
            });

            if (!response.ok) {
              throw new Error('Failed to update user');
            }

            editingId = null;
            load();
          } catch (error) {
            console.error('Save error:', error);
            alert('Failed to update user');
          }
        } else if (action === 'toggle') {
          const currentlyActive = button.dataset.active === 'true';
          try {
            const response = await fetch(`/api/admin/users/${id}/status`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ is_active: !currentlyActive })
            });

            if (!response.ok) {
              throw new Error('Failed to update status');
            }

            load();
          } catch (error) {
            console.error('Toggle status error:', error);
            alert('Failed to update user status');
          }
        } else if (action === 'delete') {
          if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) {
            return;
          }

          try {
            const response = await fetch(`/api/admin/users/${id}`, {
              method: 'DELETE',
              credentials: 'include'
            });

            if (!response.ok) {
              throw new Error('Failed to delete user');
            }

            load();
          } catch (error) {
            console.error('Delete error:', error);
            alert('Failed to delete user');
          }
        }
      });

      document.getElementById('refreshBtn').addEventListener('click', load);
      document.getElementById('search').addEventListener('input', () => {
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(load, 300);
      });

      load();
    })();
  </script>
</body>

</html>
