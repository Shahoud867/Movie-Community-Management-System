<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin • Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Brand colors – keep consistent with the rest of the app
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f9ff',
                            100: '#e6f0ff',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                        },
                    },
                },
            },
        };
    </script>
    <style>
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
    </style>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800/60 border border-slate-700 rounded-xl p-8 shadow-2xl animate-fade-in-up">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-white">Admin Sign In</h1>
            <p class="text-slate-400 mt-2">Manage movies, users, and moderation.</p>
        </header>

        <form id="adminLoginForm" class="space-y-5">
            <div>
                <label class="block text-sm text-slate-300 mb-1" for="email">Email address</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-2 bg-slate-700/50 text-slate-100 rounded focus:outline-none focus:ring-2 focus:ring-brand-600" />
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1" for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6"
                    class="w-full px-4 py-2 bg-slate-700/50 text-slate-100 rounded focus:outline-none focus:ring-2 focus:ring-brand-600" />
            </div>
            <div id="errorMsg" class="hidden text-sm text-red-400"></div>
            <button type="submit"
                class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2 rounded transition-colors shadow">
                Sign In
            </button>
            <div class="flex justify-between text-sm mt-2">
                <a href="../register.html" class="text-brand-400 hover:text-brand-300">User Sign‑Up</a>
                <a href="register.html" class="text-brand-400 hover:text-brand-300">Admin Sign‑Up</a>
            </div>
        </form>
    </div>

    <script>
        // CSP‑compliant event handling
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const payload = {
                email: form.email.value.trim(),
                password: form.password.value,
            };
            const errorEl = document.getElementById('errorMsg');
            errorEl.classList.add('hidden');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload),
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }
                // Store token and admin data
                if (data.token) {
                    localStorage.setItem('adminToken', data.token);
                }
                if (data.admin) {
                    localStorage.setItem('admin', JSON.stringify(data.admin));
                }
                // Successful login – redirect to admin dashboard
                window.location.href = '/admin/dashboard.html';
            } catch (err) {
                console.error('Admin login error:', err);
                errorEl.textContent = err.message || 'An unexpected error occurred';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
