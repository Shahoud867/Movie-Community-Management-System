<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex">
  <div id="sidebar"></div>
  <main class="flex-1 min-w-0">
    <header class="border-b border-slate-800/60 px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-semibold">Admin Settings</h1>
      <a class="text-sm text-brand-400 hover:text-brand-300" href="../dashboard.html">← Back to App</a>
    </header>
    <section class="p-4 max-w-2xl">
      <div id="profile-container" class="space-y-6">
        <div class="text-center py-12 text-slate-400">Loading profile...</div>
      </div>
    </section>
  </main>

  <script>
    (async function () {
      const sidebar = await fetch('../components/admin-sidebar.html').then(r => r.text());
      document.getElementById('sidebar').innerHTML = sidebar;

      const container = document.getElementById('profile-container');

      async function loadProfile() {
        try {
          const response = await fetch('/api/admin/profile', { credentials: 'include' });

          if (!response.ok) {
            throw new Error('Failed to load profile');
          }

          const data = await response.json();
          const profile = data.admin;

          container.innerHTML = `
            <div class="bg-slate-800/60 border border-slate-700 rounded-lg p-6 mb-6">
              <div class="flex items-center gap-4 mb-6">
                <div class="w-16 h-16 bg-brand-600 rounded-full flex items-center justify-center text-2xl font-bold text-white">
                  ${profile.name.charAt(0).toUpperCase()}
                </div>
                <div>
                  <h2 class="text-xl font-bold text-white">${profile.name}</h2>
                  <p class="text-slate-400">${profile.email}</p>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm text-slate-400 mb-1">Role</label>
                  <p class="text-white font-medium capitalize">${profile.role}</p>
                </div>
                <div>
                  <label class="block text-sm text-slate-400 mb-1">Admin ID</label>
                  <p class="text-white font-medium">#${profile.admin_id}</p>
                </div>
                <div>
                  <label class="block text-sm text-slate-400 mb-1">Super Admin</label>
                  <p class="text-white font-medium">${profile.is_super_admin ? 'Yes' : 'No'}</p>
                </div>
                <div>
                  <label class="block text-sm text-slate-400 mb-1">Created Date</label>
                  <p class="text-white font-medium">${new Date(profile.created_date).toLocaleDateString()}</p>
                </div>
              </div>
            </div>

            <div class="bg-slate-800/60 border border-slate-700 rounded-lg p-6 mb-6">
              <h3 class="text-lg font-semibold mb-4">System Information</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div>
                  <span class="text-slate-400">System Version:</span>
                  <span class="text-white ml-2">v1.0.0</span>
                </div>
                <div>
                  <span class="text-slate-400">Database:</span>
                  <span class="text-white ml-2">MySQL</span>
                </div>
                <div>
                  <span class="text-slate-400">Environment:</span>
                  <span class="text-white ml-2">Production</span>
                </div>
                <div>
                  <span class="text-slate-400">Last Backup:</span>
                  <span class="text-white ml-2">${new Date().toLocaleDateString()}</span>
                </div>
              </div>
            </div>

            <div class="flex justify-end gap-3">
              <button data-action="clear-cache" 
                class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                Clear Cache
              </button>
              <button data-action="logout"
                class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                Sign Out
              </button>
            </div>
          `;

          // Add event listeners after content is loaded
          setupEventListeners();

        } catch (error) {
          console.error('Load profile error:', error);
          container.innerHTML = '<p class="text-red-400">Failed to load profile. Please try again.</p>';
        }
      }

      function setupEventListeners() {
        // Event delegation for buttons
        container.addEventListener('click', async (e) => {
          const button = e.target.closest('button[data-action]');
          if (!button) return;

          const action = button.dataset.action;

          if (action === 'clear-cache') {
            handleClearCache();
          } else if (action === 'logout') {
            await handleLogout();
          }
        });
      }

      function handleClearCache() {
        if (confirm('Are you sure you want to clear the browser cache?\n\nThis will:\n• Clear cached API responses\n• Clear local storage\n• Refresh the page')) {
          try {
            // Clear localStorage
            localStorage.clear();

            // Clear sessionStorage
            sessionStorage.clear();

            // Clear cookies (admin token)
            document.cookie.split(";").forEach(function (c) {
              document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });

            alert('Cache cleared successfully! The page will now reload.');
            window.location.reload(true);
          } catch (error) {
            console.error('Clear cache error:', error);
            alert('Failed to clear cache. Please try manually clearing your browser cache.');
          }
        }
      }

      async function handleLogout() {
        if (!confirm('Are you sure you want to sign out?')) {
          return;
        }

        try {
          const response = await fetch('/api/admin/logout', {
            method: 'POST',
            credentials: 'include'
          });

          // Clear local storage and session storage
          localStorage.clear();
          sessionStorage.clear();

          // Redirect to login page
          window.location.href = 'login.html';
        } catch (error) {
          console.error('Logout error:', error);
          // Even if the API call fails, redirect to login
          localStorage.clear();
          sessionStorage.clear();
          window.location.href = 'login.html';
        }
      }

      // Initial load
      loadProfile();
    })();
  </script>
</body>

</html>
