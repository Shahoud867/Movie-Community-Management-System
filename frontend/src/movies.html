<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Movies — Movie Community</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f9ff',
              100: '#e6f0ff',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
            },
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100 antialiased flex flex-col">
  <a href="#main"
    class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-brand-600 text-white px-3 py-2 rounded">Skip
    to content</a>
  <div id="navbar-container"></div>
  <main id="main" class="flex-1">
    <div class="max-w-7xl mx-auto px-4 py-8 grid gap-8 lg:grid-cols-[250px_1fr]">
      <!-- Sidebar Filters -->
      <aside aria-labelledby="filtersHeading" class="space-y-6">
        <h2 id="filtersHeading" class="text-lg font-semibold">Filters</h2>
        <!-- Genres -->
        <div class="space-y-3">
          <h3 class="text-sm font-medium tracking-wide">Genres</h3>
          <div id="genreFilters" class="space-y-2 max-h-56 overflow-y-auto pr-1">
            <p class="text-xs text-slate-400">Loading genres...</p>
          </div>
        </div>
        <!-- Release Year Range -->
        <div class="space-y-2">
          <h3 class="text-sm font-medium tracking-wide">Release Year</h3>
          <div class="space-y-2">
            <input type="range" id="minYear" min="1950" max="2025" value="2000" class="w-full" />
            <input type="range" id="maxYear" min="1950" max="2025" value="2025" class="w-full" />
            <p class="text-xs text-slate-400">From <span id="minYearVal">2000</span> to <span
                id="maxYearVal">2025</span></p>
          </div>
        </div>
        <!-- Rating Range -->
        <div class="space-y-2">
          <h3 class="text-sm font-medium tracking-wide">Rating</h3>
          <div class="space-y-2">
            <input type="range" id="minRating" min="0" max="10" value="0" step="0.5" class="w-full" />
            <input type="range" id="maxRating" min="0" max="10" value="10" step="0.5" class="w-full" />
            <p class="text-xs text-slate-400">From <span id="minRatingVal">0</span> to <span id="maxRatingVal">10</span>
            </p>
          </div>
        </div>
        <!-- Sort -->
        <div class="space-y-2">
          <h3 class="text-sm font-medium tracking-wide">Sort</h3>
          <select id="sortSelect"
            class="w-full rounded-md bg-slate-800 border border-slate-700 text-sm px-2 py-1 focus:border-brand-600">
            <option value="popular">Popularity</option>
            <option value="rating">Highest Rated</option>
            <option value="recent">Newest</option>
            <option value="title">Title (A-Z)</option>
            <option value="year">Release Year</option>
          </select>
        </div>
        <div class="flex gap-2 pt-2">
          <button id="applyFilters"
            class="flex-1 bg-brand-600 hover:bg-brand-500 transition-colors text-sm font-medium rounded px-3 py-2">Apply</button>
          <button id="resetFilters"
            class="flex-1 bg-slate-700 hover:bg-slate-600 transition-colors text-sm font-medium rounded px-3 py-2">Reset</button>
        </div>
      </aside>

      <!-- Movie Grid -->
      <section aria-labelledby="browseHeading" class="space-y-4">
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <h2 id="browseHeading" class="text-xl font-semibold">Browse Movies</h2>
          <p id="resultsMeta" class="text-xs text-slate-400">Loading catalog...</p>
        </div>
        <div id="moviesGrid" class="grid grid-cols-2 md:grid-cols-5 gap-4 min-h-[200px]">
          <!-- Skeleton placeholders -->
          <div class="aspect-[2/3] rounded-lg bg-slate-800/70 animate-pulse"></div>
          <div class="aspect-[2/3] rounded-lg bg-slate-800/70 animate-pulse"></div>
          <div class="aspect-[2/3] rounded-lg bg-slate-800/70 animate-pulse"></div>
          <div class="aspect-[2/3] rounded-lg bg-slate-800/70 animate-pulse"></div>
          <div class="aspect-[2/3] rounded-lg bg-slate-800/70 animate-pulse"></div>
        </div>
        <div class="flex justify-center pt-4" id="paginationWrapper" hidden>
          <button id="prevPage" class="px-3 py-1.5 text-sm rounded bg-slate-800 disabled:opacity-40">Prev</button>
          <span id="pageIndicator" class="mx-4 text-sm text-slate-300">1</span>
          <button id="nextPage" class="px-3 py-1.5 text-sm rounded bg-slate-800 disabled:opacity-40">Next</button>
        </div>
      </section>
    </div>
  </main>
  <footer class="mt-auto border-t border-slate-800/60">
    <div class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-400 flex flex-wrap gap-4">
      <span>&copy; 2025 Movie Community</span>
      <span class="opacity-70">All rights reserved.</span>
      <span class="opacity-70">Movies Browse 1.0</span>
    </div>
  </footer>
  <script>
    const genreFiltersEl = document.getElementById('genreFilters');
    const moviesGrid = document.getElementById('moviesGrid');
    const resultsMeta = document.getElementById('resultsMeta');
    const minYear = document.getElementById('minYear');
    const maxYear = document.getElementById('maxYear');
    const minYearVal = document.getElementById('minYearVal');
    const maxYearVal = document.getElementById('maxYearVal');
    const minRating = document.getElementById('minRating');
    const maxRating = document.getElementById('maxRating');
    const minRatingVal = document.getElementById('minRatingVal');
    const maxRatingVal = document.getElementById('maxRatingVal');
    const sortSelect = document.getElementById('sortSelect');
    const applyBtn = document.getElementById('applyFilters');
    const resetBtn = document.getElementById('resetFilters');
    const prevPageBtn = document.getElementById('prevPage');
    const nextPageBtn = document.getElementById('nextPage');
    const pageIndicator = document.getElementById('pageIndicator');
    const paginationWrapper = document.getElementById('paginationWrapper');
    const notifBtn = document.getElementById('notifBtn');
    const notifDropdown = document.getElementById('notifDropdown');
    const notifBadge = document.getElementById('notifBadge');
    const notifList = document.getElementById('notifList');
    const profileBtn = document.getElementById('profileBtn');
    const profileDropdown = document.getElementById('profileDropdown');
    const logoutBtn = document.getElementById('logoutBtn');
    const searchInput = document.getElementById('globalSearch');
    const searchResults = document.getElementById('searchResults');

    let currentPage = 1;
    let totalPages = 1;

    function updateRangeDisplays() {
      minYearVal.textContent = minYear.value;
      maxYearVal.textContent = maxYear.value;
      minRatingVal.textContent = minRating.value;
      maxRatingVal.textContent = maxRating.value;
    }

    async function fetchGenres() {
      try {
        const res = await fetch('/api/genres');
        if (!res.ok) throw new Error('Failed to load genres');
        const genres = await res.json();
        genreFiltersEl.innerHTML = '';
        genres.forEach(g => {
          const id = 'genre_' + (g.genre_id || g.genre_name);
          const wrapper = document.createElement('div');
          wrapper.className = 'flex items-center gap-2';
          wrapper.innerHTML = `<input type="checkbox" id="${id}" value="${g.genre_id}" class="h-4 w-4 rounded border-slate-600 bg-slate-800 focus:ring-brand-600"> <label for="${id}" class="text-xs">${g.genre_name}</label>`;
          genreFiltersEl.appendChild(wrapper);
        });
      } catch (e) {
        console.error(e);
        genreFiltersEl.innerHTML = '<p class="text-xs text-red-400">Failed to load genres.</p>';
      }
    }

    function skeleton(count) {
      moviesGrid.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const d = document.createElement('div');
        d.className = 'aspect-[2/3] rounded-lg bg-slate-800/70 animate-pulse';
        moviesGrid.appendChild(d);
      }
    }

    function buildQuery() {
      const selectedGenres = [...genreFiltersEl.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
      const params = new URLSearchParams();
      if (selectedGenres.length) params.set('genres', selectedGenres.join(','));
      params.set('minYear', minYear.value);
      params.set('maxYear', maxYear.value);
      params.set('minRating', minRating.value);
      params.set('maxRating', maxRating.value);
      params.set('sort', sortSelect.value);
      params.set('page', currentPage);
      return params.toString();
    }

    function createMovieCard(movie) {
      const a = document.createElement('a');
      a.href = `./movie.html?id=${movie.movie_id || ''}`;
      a.className = 'group relative aspect-[2/3] rounded-lg overflow-hidden bg-slate-800 border border-slate-700/60 hover:border-brand-600/60 transition-colors flex flex-col';
      a.innerHTML = `<div class='flex-1 flex items-center justify-center'>
        ${movie.poster ? `<img src="${movie.poster}" alt="${movie.title}" class="object-cover w-full h-full">` : '<span class="text-xs text-slate-400">No poster</span>'}
      </div>
      <div class='absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-900/80 to-transparent p-2'>
        <p class='text-[11px] font-medium line-clamp-2'>${movie.title || 'Untitled'}</p>
        <p class='text-[10px] text-slate-300 mt-1'>Rating: ${(movie.average_rating ?? 'N/A')}</p>
      </div>`;
      return a;
    }

    async function fetchMovies() {
      skeleton(5);
      resultsMeta.textContent = 'Loading results...';
      try {
        const query = buildQuery();
        const res = await fetch(`/api/movies?${query}`);
        if (!res.ok) throw new Error('Failed to load movies');
        const data = await res.json();
        const items = data.movies || [];
        const pagination = data.pagination || {};
        
        moviesGrid.innerHTML = '';
        if (!items.length) {
          moviesGrid.innerHTML = '<p class="text-sm text-slate-400 col-span-full">No movies match filters.</p>';
        } else {
          items.forEach(m => moviesGrid.appendChild(createMovieCard(m)));
        }
        currentPage = pagination.page || 1;
        totalPages = pagination.totalPages || 1;
        pageIndicator.textContent = `${currentPage} / ${totalPages}`;
        prevPageBtn.disabled = currentPage <= 1;
        nextPageBtn.disabled = currentPage >= totalPages;
        paginationWrapper.hidden = totalPages <= 1;
        resultsMeta.textContent = `${pagination.total || items.length} result(s)`;
      } catch (e) {
        console.error(e);
        moviesGrid.innerHTML = '<p class="text-sm text-red-400 col-span-full">Failed to load movies.</p>';
        paginationWrapper.hidden = true;
        resultsMeta.textContent = 'Error loading catalog';
      }
    }

    function resetFilters() {
      [...genreFiltersEl.querySelectorAll('input[type=checkbox]')].forEach(c => c.checked = false);
      minYear.value = '2000'; maxYear.value = '2025';
      minRating.value = '0'; maxRating.value = '10';
      sortSelect.value = 'popular';
      currentPage = 1;
      updateRangeDisplays();
      fetchMovies();
    }

    function debounce(fn, delay = 300) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
    }
    const debouncedFetch = debounce(() => { currentPage = 1; fetchMovies(); }, 400);

    // Event listeners
    minYear.addEventListener('input', () => { if (+minYear.value > +maxYear.value) minYear.value = maxYear.value; updateRangeDisplays(); debouncedFetch(); });
    maxYear.addEventListener('input', () => { if (+maxYear.value < +minYear.value) maxYear.value = minYear.value; updateRangeDisplays(); debouncedFetch(); });
    minRating.addEventListener('input', () => { if (+minRating.value > +maxRating.value) minRating.value = maxRating.value; updateRangeDisplays(); debouncedFetch(); });
    maxRating.addEventListener('input', () => { if (+maxRating.value < +minRating.value) maxRating.value = minRating.value; updateRangeDisplays(); debouncedFetch(); });
    sortSelect.addEventListener('change', () => { currentPage = 1; fetchMovies(); });
    applyBtn.addEventListener('click', () => { currentPage = 1; fetchMovies(); });
    resetBtn.addEventListener('click', resetFilters);
    prevPageBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; fetchMovies(); } });
    nextPageBtn.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; fetchMovies(); } });

    // Global search
    if (searchInput) {
      let searchTimer = null;
      searchInput.addEventListener('input', e => {
        const term = e.target.value.trim();
        if (searchTimer) clearTimeout(searchTimer);
        if (!term) { searchResults.classList.add('hidden'); return; }
        searchTimer = setTimeout(async () => {
          try {
            const res = await fetch('/api/movies/search?query=' + encodeURIComponent(term));
            const movies = await res.json();
            searchResults.innerHTML = '';
            if (!movies.length) {
              searchResults.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No movies found</div>';
              searchResults.classList.remove('hidden');
              return;
            }
            movies.forEach(m => {
              const a = document.createElement('a');
              a.href = `./movie.html?id=${m.id}`;
              a.className = 'block px-4 py-2 hover:bg-slate-800/60 text-sm';
              a.innerHTML = `<span class="font-medium">${m.title}</span> <span class="text-xs text-slate-400">(${m.release_year || ''})</span>`;
              searchResults.appendChild(a);
            });
            searchResults.classList.remove('hidden');
          } catch { }
        }, 300);
      });
    }

    // Notifications
    if (notifBtn) {
      notifBtn.addEventListener('click', async () => {
        notifDropdown.classList.toggle('hidden');
        if (!notifDropdown.classList.contains('hidden')) await loadNotifications();
      });
    }
    async function loadNotifications() {
      try {
        const res = await fetch('/api/notifications?unread=true');
        const notifs = await res.json();
        notifList.innerHTML = '';
        if (!notifs.length) {
          notifList.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No new notifications</div>';
          notifBadge.classList.add('hidden');
          return;
        }
        notifBadge.textContent = Math.min(notifs.length, 9);
        notifBadge.classList.remove('hidden');
        notifs.slice(0, 5).forEach(n => {
          const div = document.createElement('div');
          div.className = 'px-4 py-3 hover:bg-slate-700/40 cursor-pointer text-sm';
          div.innerHTML = `<p>${n.message}</p><p class="text-xs text-slate-400 mt-1">${new Date(n.created_date.replace(' ', 'T')).toLocaleString()}</p>`;
          div.addEventListener('click', async () => {
            await fetch(`/api/notifications/${n.id}/seen`, { method: 'POST' });
            await loadNotifications();
          });
          notifList.appendChild(div);
        });
      } catch { }
    }

    // Profile dropdown
    if (profileBtn) {
      profileBtn.addEventListener('click', () => profileDropdown.classList.toggle('hidden'));
    }
    // Logout
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        try {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
          localStorage.clear();
        } catch (e) {
          console.error(e);
        }
        window.location.href = '/login.html';
      });
    }

    // Load notifications on start (profile loaded by navbar component)
    (async () => {
      try {
        await loadNotifications();
      } catch { }
    })();

    // Global click handler to close dropdowns
    document.addEventListener('click', e => {
      if (notifBtn && !notifBtn.contains(e.target) && !notifDropdown.contains(e.target)) notifDropdown.classList.add('hidden');
      if (profileBtn && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) profileDropdown.classList.add('hidden');
      if (searchInput && !searchInput.contains(e.target) && !searchResults.contains(e.target)) searchResults.classList.add('hidden');
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      // Load navbar component
      try {
        const response = await fetch('/components/navbar-enhanced.html');
        const html = await response.text();
        document.getElementById('navbar-container').innerHTML = html;
        
        // Execute the navbar script manually since innerHTML doesn't execute scripts
        const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/);
        if (scriptMatch) {
          const scriptContent = scriptMatch[1];
          const scriptEl = document.createElement('script');
          scriptEl.textContent = scriptContent;
          document.body.appendChild(scriptEl);
        }
      } catch (error) {
        console.error('Failed to load navbar:', error);
      }

      await fetchGenres();
      updateRangeDisplays();
      fetchMovies();
    });
  </script>
</body>

</html>
